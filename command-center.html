<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMDC Command Center</title>
<style>
/* ═══════════════════════ TOKENS ═══════════════════════ */
:root{
  --ground:#F2F5F4; --surface:#FFFFFF; --surface-2:#EAF0EE; --line:#D8E0DE; --line-soft:#E4EAE8;
  --ink:#182529; --muted:#5B6B70; --faint:#8FA0A3;
  --accent:#0F6C68; --accent-ink:#0A4E4B; --accent-soft:rgba(15,108,104,0.09); --accent-line:rgba(15,108,104,0.28);
  --good:#2C7A44; --good-soft:rgba(44,122,68,0.10);
  --warn:#A96F0B; --warn-soft:rgba(169,111,11,0.11);
  --crit:#B23A30; --crit-soft:rgba(178,58,48,0.10);
  --hold:#6B7A80; --hold-soft:rgba(107,122,128,0.12);
  --shadow:0 1px 2px rgba(24,37,41,0.05), 0 4px 16px rgba(24,37,41,0.06);
  --radius:10px;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --ground:#0F1719; --surface:#162124; --surface-2:#1C2A2E; --line:#26363A; --line-soft:#1F2D31;
    --ink:#E4ECEB; --muted:#93A5A8; --faint:#5F7377;
    --accent:#4CB8AD; --accent-ink:#7FD4CB; --accent-soft:rgba(76,184,173,0.12); --accent-line:rgba(76,184,173,0.35);
    --good:#5BBB7B; --good-soft:rgba(91,187,123,0.13);
    --warn:#D9A44B; --warn-soft:rgba(217,164,75,0.13);
    --crit:#E07A6F; --crit-soft:rgba(224,122,111,0.13);
    --hold:#8FA0A5; --hold-soft:rgba(143,160,165,0.14);
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 4px 18px rgba(0,0,0,0.25);
  }
}
:root[data-theme="dark"]{
  --ground:#0F1719; --surface:#162124; --surface-2:#1C2A2E; --line:#26363A; --line-soft:#1F2D31;
  --ink:#E4ECEB; --muted:#93A5A8; --faint:#5F7377;
  --accent:#4CB8AD; --accent-ink:#7FD4CB; --accent-soft:rgba(76,184,173,0.12); --accent-line:rgba(76,184,173,0.35);
  --good:#5BBB7B; --good-soft:rgba(91,187,123,0.13);
  --warn:#D9A44B; --warn-soft:rgba(217,164,75,0.13);
  --crit:#E07A6F; --crit-soft:rgba(224,122,111,0.13);
  --hold:#8FA0A5; --hold-soft:rgba(143,160,165,0.14);
  --shadow:0 1px 2px rgba(0,0,0,0.3), 0 4px 18px rgba(0,0,0,0.25);
}
:root[data-theme="light"]{
  --ground:#F2F5F4; --surface:#FFFFFF; --surface-2:#EAF0EE; --line:#D8E0DE; --line-soft:#E4EAE8;
  --ink:#182529; --muted:#5B6B70; --faint:#8FA0A3;
  --accent:#0F6C68; --accent-ink:#0A4E4B; --accent-soft:rgba(15,108,104,0.09); --accent-line:rgba(15,108,104,0.28);
  --good:#2C7A44; --good-soft:rgba(44,122,68,0.10);
  --warn:#A96F0B; --warn-soft:rgba(169,111,11,0.11);
  --crit:#B23A30; --crit-soft:rgba(178,58,48,0.10);
  --hold:#6B7A80; --hold-soft:rgba(107,122,128,0.12);
  --shadow:0 1px 2px rgba(24,37,41,0.05), 0 4px 16px rgba(24,37,41,0.06);
}

*{ margin:0; padding:0; box-sizing:border-box; }
html{ font-size:15px; }
body{
  font-family:var(--sans); background:var(--ground); color:var(--ink);
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
button{ font-family:inherit; cursor:pointer; }
input,select,textarea{ font-family:inherit; font-size:0.9rem; color:var(--ink); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{ transition:none !important; animation:none !important; } }

/* ═══════════════════════ SHELL ═══════════════════════ */
.shell{ display:flex; min-height:100vh; }
.rail{
  width:218px; flex:0 0 218px; background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.rail-brand{ padding:20px 18px 14px; border-bottom:1px solid var(--line-soft); }
.rail-brand .eyebrow{ font-size:0.62rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); font-weight:700; }
.rail-brand h1{ font-size:1.02rem; font-weight:800; letter-spacing:-0.01em; margin-top:3px; }
.rail-brand h1 span{ color:var(--accent); }
.rail-nav{ padding:10px; display:flex; flex-direction:column; gap:2px; }
.rail-btn{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:9px 10px; border:none; background:transparent; border-radius:8px;
  font-size:0.88rem; font-weight:600; color:var(--muted); transition:background .12s,color .12s;
}
.rail-btn:hover{ background:var(--surface-2); color:var(--ink); }
.rail-btn.active{ background:var(--accent-soft); color:var(--accent-ink); }
.rail-btn .badge{
  margin-left:auto; font-family:var(--mono); font-size:0.7rem; font-weight:700;
  background:var(--surface-2); color:var(--muted); border-radius:20px; padding:1px 7px;
}
.rail-btn .badge.crit{ background:var(--crit-soft); color:var(--crit); }
.rail-plans{ padding:6px 10px; border-top:1px solid var(--line-soft); overflow-y:auto; flex:1; }
.rail-plans .glbl{ font-size:0.62rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--faint); font-weight:700; padding:6px 10px 4px; display:block; }
.rail-plan{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left; border:none; background:transparent;
  padding:7px 10px; border-radius:8px; font-size:0.82rem; font-weight:600; color:var(--muted);
}
.rail-plan:hover{ background:var(--surface-2); color:var(--ink); }
.rail-plan.active{ background:var(--accent-soft); color:var(--accent-ink); }
.rail-plan .dot{ width:7px; height:7px; border-radius:50%; flex:0 0 7px; background:var(--faint); }
.rail-plan .dot.ok{ background:var(--good); }
.rail-plan .dot.warn{ background:var(--warn); }
.rail-plan .dot.crit{ background:var(--crit); }
.rail-plan .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rail-foot{ padding:10px; border-top:1px solid var(--line-soft); display:flex; gap:6px; }

.main{ flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar{
  position:sticky; top:0; z-index:30; background:var(--ground); border-bottom:1px solid var(--line);
  padding:12px 26px; display:flex; align-items:center; gap:14px;
}
.topbar .crumb{ font-size:0.95rem; font-weight:800; letter-spacing:-0.01em; }
.topbar .today{ font-family:var(--mono); font-size:0.75rem; color:var(--muted); }
.topbar .spacer{ flex:1; }
.content{ padding:22px 26px 60px; max-width:1240px; width:100%; }

/* ═══════════════════════ CONTROLS ═══════════════════════ */
.btn{
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:8px; padding:8px 14px; font-size:0.84rem; font-weight:700; transition:border-color .12s, background .12s;
}
.btn:hover{ border-color:var(--accent); }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.primary:hover{ filter:brightness(1.08); }
:root[data-theme="dark"] .btn.primary{ color:#0F1719; }
.btn.ghost{ background:transparent; }
.btn.sm{ padding:5px 10px; font-size:0.76rem; }
.icon-btn{ border:1px solid var(--line); background:var(--surface); border-radius:8px; width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center; color:var(--muted); }
.icon-btn:hover{ color:var(--ink); border-color:var(--accent); }

/* ═══════════════════════ DECK / KPI ═══════════════════════ */
.kpi-band{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
.kpi{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 16px; box-shadow:var(--shadow);
}
.kpi .k-lbl{ font-size:0.64rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); font-weight:700; }
.kpi .k-val{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:1.7rem; font-weight:700; margin-top:4px; line-height:1.1; }
.kpi .k-sub{ font-size:0.72rem; color:var(--muted); margin-top:3px; }
.kpi.crit .k-val{ color:var(--crit); }
.kpi.warn .k-val{ color:var(--warn); }
.kpi.good .k-val{ color:var(--good); }

.deck-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-bottom:22px; }
.panel{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column;
}
.panel-hd{
  padding:11px 15px; border-bottom:1px solid var(--line-soft); display:flex; align-items:center; gap:8px;
}
.panel-hd h3{ font-size:0.78rem; letter-spacing:0.1em; text-transform:uppercase; font-weight:800; }
.panel-hd .cnt{ margin-left:auto; font-family:var(--mono); font-size:0.72rem; font-weight:700; color:var(--muted); }
.panel-hd .stripe{ width:8px; height:8px; border-radius:2px; }
.panel-body{ padding:6px 8px 10px; flex:1; }
.panel-empty{ font-size:0.8rem; color:var(--faint); padding:14px 10px; }

.agenda-row{
  display:flex; align-items:flex-start; gap:9px; padding:8px 8px; border-radius:8px; width:100%;
  border:none; background:transparent; text-align:left; color:var(--ink);
}
.agenda-row:hover{ background:var(--surface-2); }
.agenda-row .when{
  font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:0.7rem; font-weight:700;
  color:var(--muted); flex:0 0 58px; padding-top:2px;
}
.agenda-row .when.crit{ color:var(--crit); }
.agenda-row .when.warn{ color:var(--warn); }
.agenda-row .what{ min-width:0; }
.agenda-row .what b{ font-size:0.84rem; font-weight:700; display:block; }
.agenda-row .what span{ font-size:0.72rem; color:var(--muted); }

/* plan cards */
.cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:14px; }
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:15px 16px 13px; display:flex; flex-direction:column; gap:10px;
  transition:border-color .12s;
}
.card:hover{ border-color:var(--accent-line); }
.card-top{ display:flex; align-items:flex-start; gap:10px; }
.card-top .ttl{ font-size:0.98rem; font-weight:800; letter-spacing:-0.01em; background:none; border:none; color:var(--ink); text-align:left; padding:0; }
.card-top .ttl:hover{ color:var(--accent); }
.card-top .case{ font-family:var(--mono); font-size:0.7rem; color:var(--muted); margin-top:2px; }
.pill{
  font-size:0.64rem; font-weight:800; letter-spacing:0.08em; text-transform:uppercase;
  border-radius:20px; padding:3px 9px; white-space:nowrap;
}
.pill.pre{ background:var(--hold-soft); color:var(--hold); }
.pill.active{ background:var(--good-soft); color:var(--good); }
.pill.hold{ background:var(--warn-soft); color:var(--warn); }
.pill.done{ background:var(--accent-soft); color:var(--accent-ink); }
.card-dates{ display:flex; flex-wrap:wrap; gap:6px; }
.datechip{
  font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:0.68rem; font-weight:600;
  background:var(--surface-2); color:var(--muted); border-radius:6px; padding:3px 7px;
}
.datechip b{ color:var(--ink); font-weight:700; }
.datechip.crit{ background:var(--crit-soft); } .datechip.crit b{ color:var(--crit); }
.datechip.warn{ background:var(--warn-soft); } .datechip.warn b{ color:var(--warn); }
.progress{ height:6px; background:var(--surface-2); border-radius:4px; overflow:hidden; display:flex; gap:2px; }
.progress i{ display:block; height:100%; background:var(--accent); border-radius:4px; }
.prog-lbl{ display:flex; justify-content:space-between; font-size:0.7rem; color:var(--muted); }
.prog-lbl b{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.card-warns{ display:flex; flex-direction:column; gap:5px; }
.cwarn{
  font-size:0.74rem; font-weight:600; border-radius:7px; padding:6px 9px;
  background:var(--warn-soft); color:var(--warn); border-left:3px solid var(--warn);
}
.cwarn.crit{ background:var(--crit-soft); color:var(--crit); border-left-color:var(--crit); }
.card-foot{ display:flex; gap:6px; margin-top:2px; }

/* ═══════════════════════ PLAN DETAIL ═══════════════════════ */
.plan-hd{ margin-bottom:18px; }
.plan-hd .row1{ display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap; }
.plan-hd h2{ font-size:1.5rem; font-weight:800; letter-spacing:-0.02em; text-wrap:balance; }
.plan-hd .meta{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.countdown{
  background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:8px 12px;
  display:flex; flex-direction:column; gap:1px; min-width:104px;
}
.countdown .c-lbl{ font-size:0.6rem; letter-spacing:0.11em; text-transform:uppercase; color:var(--muted); font-weight:700; }
.countdown .c-val{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:0.95rem; font-weight:700; }
.countdown .c-sub{ font-family:var(--mono); font-size:0.66rem; color:var(--faint); }
.countdown.crit .c-val{ color:var(--crit); }
.countdown.warn .c-val{ color:var(--warn); }
.countdown.good .c-val{ color:var(--good); }

.detail-grid{ display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:16px; align-items:start; }
.phase-list{ display:flex; flex-direction:column; gap:12px; }
.phase-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
.phase-hd{
  display:flex; align-items:center; gap:10px; padding:11px 14px; width:100%; border:none; text-align:left;
  background:transparent; color:var(--ink);
}
.phase-hd:hover{ background:var(--surface-2); }
.phase-hd .ph-num{
  font-family:var(--mono); font-size:0.68rem; font-weight:700; color:var(--accent-ink);
  background:var(--accent-soft); border-radius:6px; padding:3px 7px;
}
.phase-hd h3{ font-size:0.92rem; font-weight:800; }
.phase-hd .ph-cnt{ margin-left:auto; font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:0.74rem; font-weight:700; color:var(--muted); }
.phase-hd .chev{ color:var(--faint); transition:transform .15s; }
.phase-card.collapsed .chev{ transform:rotate(-90deg); }
.phase-card.collapsed .phase-body{ display:none; }
.phase-mini{ height:4px; display:flex; gap:2px; margin:0 14px 0; border-radius:3px; overflow:hidden; background:var(--surface-2); }
.phase-mini i{ height:100%; background:var(--accent); }
.phase-body{ border-top:1px solid var(--line-soft); padding:4px 0 6px; }

.trow{ display:flex; flex-direction:column; border-bottom:1px solid var(--line-soft); padding:9px 14px; gap:6px; }
.trow:last-child{ border-bottom:none; }
.trow-main{ display:flex; align-items:center; gap:10px; }
.trow .t-name{ font-size:0.88rem; font-weight:700; }
.trow .t-sub{ font-size:0.72rem; color:var(--muted); margin-top:1px; }
.trow .t-due{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:0.7rem; font-weight:700; color:var(--muted); }
.trow .t-due.crit{ color:var(--crit); }
.trow .t-due.warn{ color:var(--warn); }
.trow.is-done .t-name{ color:var(--muted); text-decoration:line-through; text-decoration-color:var(--faint); }
.trow.is-na{ opacity:0.5; }
.trow-warn{ font-size:0.72rem; color:var(--warn); font-weight:600; }
.t-ctrl{ margin-left:auto; display:flex; gap:4px; flex:0 0 auto; }
.stbtn{
  border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:7px;
  font-size:0.68rem; font-weight:800; letter-spacing:0.03em; padding:4px 8px; text-transform:uppercase;
}
.stbtn:hover{ border-color:var(--accent); color:var(--ink); }
.stbtn.on-open{ background:var(--surface-2); color:var(--ink); border-color:var(--line); }
.stbtn.on-working{ background:var(--warn-soft); color:var(--warn); border-color:var(--warn); }
.stbtn.on-done{ background:var(--good-soft); color:var(--good); border-color:var(--good); }
.stbtn.on-na{ background:var(--hold-soft); color:var(--hold); border-color:var(--hold); }
.t-note{ width:100%; }
.t-note textarea{
  width:100%; border:1px solid var(--line-soft); background:var(--ground); border-radius:7px;
  padding:6px 9px; font-size:0.78rem; resize:vertical; min-height:30px;
}
.t-note textarea:focus{ border-color:var(--accent); outline:none; }
.note-toggle{ background:none; border:none; color:var(--faint); font-size:0.7rem; font-weight:700; padding:0; text-align:left; }
.note-toggle:hover{ color:var(--accent); }
.note-toggle.has-note{ color:var(--accent-ink); }

.side-col{ display:flex; flex-direction:column; gap:14px; position:sticky; top:70px; }
.side-panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:13px 15px; }
.side-panel h4{ font-size:0.7rem; letter-spacing:0.11em; text-transform:uppercase; font-weight:800; color:var(--muted); margin-bottom:9px; }
.kv{ display:flex; justify-content:space-between; gap:8px; font-size:0.8rem; padding:4px 0; border-bottom:1px dashed var(--line-soft); }
.kv:last-child{ border-bottom:none; }
.kv .k{ color:var(--muted); }
.kv .v{ font-weight:700; text-align:right; overflow-wrap:anywhere; }
.kv .v.mono{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:0.75rem; }
.side-panel textarea{
  width:100%; border:1px solid var(--line-soft); background:var(--ground); border-radius:7px;
  padding:8px 10px; font-size:0.8rem; resize:vertical; min-height:70px;
}
.milestones{ display:flex; flex-direction:column; gap:0; }
.mst{ display:flex; gap:10px; align-items:flex-start; position:relative; padding:0 0 12px 0; }
.mst::before{ content:""; position:absolute; left:5px; top:12px; bottom:0; width:2px; background:var(--line-soft); }
.mst:last-child::before{ display:none; }
.mst .m-dot{ width:12px; height:12px; border-radius:50%; flex:0 0 12px; margin-top:2px; background:var(--surface-2); border:2px solid var(--faint); z-index:1; }
.mst.past .m-dot{ background:var(--accent); border-color:var(--accent); }
.mst.next .m-dot{ border-color:var(--accent); background:var(--surface); }
.mst .m-date{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:0.68rem; font-weight:700; color:var(--muted); width:64px; flex:0 0 64px; padding-top:2px; }
.mst .m-lbl{ font-size:0.8rem; font-weight:600; }
.mst.past .m-lbl{ color:var(--muted); }
.hist{ font-size:0.74rem; color:var(--muted); line-height:1.6; }

/* ═══════════════════════ RADAR VIEW ═══════════════════════ */
.radar-day{ margin-bottom:16px; }
.radar-day .rd-hd{ display:flex; align-items:baseline; gap:9px; margin-bottom:6px; }
.radar-day .rd-hd b{ font-size:0.86rem; font-weight:800; }
.radar-day .rd-hd span{ font-family:var(--mono); font-size:0.7rem; color:var(--muted); }
.radar-day .rd-hd.overdue b{ color:var(--crit); }

/* ═══════════════════════ SCHEDULE REFERENCE ═══════════════════════ */
.sched-wrap{ overflow-x:auto; }
table.sched{ border-collapse:collapse; width:100%; min-width:560px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); }
table.sched caption{ text-align:left; font-size:0.8rem; color:var(--muted); padding:0 2px 8px; }
table.sched th{
  font-size:0.64rem; letter-spacing:0.11em; text-transform:uppercase; color:var(--muted); font-weight:800;
  text-align:left; padding:9px 13px; border-bottom:1px solid var(--line); background:var(--surface-2);
}
table.sched td{ font-size:0.82rem; padding:8px 13px; border-bottom:1px solid var(--line-soft); }
table.sched tr:last-child td{ border-bottom:none; }
table.sched td.off{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap; }
table.sched td.ph{ color:var(--muted); font-size:0.74rem; }
.sched-note{ font-size:0.76rem; color:var(--muted); margin:10px 2px 18px; max-width:65ch; }

/* ═══════════════════════ PROCEDURES ═══════════════════════ */
.proc-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
.proc-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:14px 16px; text-decoration:none; color:var(--ink); display:block; transition:border-color .12s;
}
.proc-card:hover{ border-color:var(--accent); }
.proc-card b{ font-size:0.9rem; font-weight:800; display:block; }
.proc-card span{ font-size:0.74rem; color:var(--muted); display:block; margin-top:3px; }

/* ═══════════════════════ MODAL ═══════════════════════ */
.modal{
  position:fixed; inset:0; background:rgba(12,20,22,0.5); display:none; align-items:flex-start;
  justify-content:center; padding:40px 16px; z-index:100; overflow-y:auto;
}
.modal.open{ display:flex; }
.modal-box{
  background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow);
  width:100%; max-width:640px; padding:22px 24px;
}
.modal-box h2{ font-size:1.1rem; font-weight:800; margin-bottom:14px; }
.fgrid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.fgrid .full{ grid-column:1 / -1; }
.fld label{ display:block; font-size:0.68rem; letter-spacing:0.09em; text-transform:uppercase; font-weight:800; color:var(--muted); margin-bottom:4px; }
.fld input[type=text],.fld input[type=date],.fld input[type=email],.fld input[type=url],.fld select,.fld textarea{
  width:100%; border:1px solid var(--line); background:var(--ground); border-radius:8px; padding:8px 10px;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{ border-color:var(--accent); outline:none; }
.fld .hint{ font-size:0.68rem; color:var(--faint); margin-top:3px; }
.chk-row{ display:flex; flex-wrap:wrap; gap:10px 16px; padding-top:2px; }
.chk{ display:flex; align-items:center; gap:6px; font-size:0.82rem; font-weight:600; }
.chk input{ accent-color:var(--accent); width:15px; height:15px; }
.fsec{ font-size:0.7rem; letter-spacing:0.12em; text-transform:uppercase; font-weight:800; color:var(--accent-ink); border-bottom:1px solid var(--line-soft); padding-bottom:5px; margin-top:6px; }
.modal-foot{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
.hidden{ display:none !important; }

.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:200;
  background:var(--ink); color:var(--ground); font-size:0.82rem; font-weight:700;
  border-radius:9px; padding:9px 16px; opacity:0; pointer-events:none; transition:opacity .2s;
}
.toast.show{ opacity:1; }

.empty-deck{
  background:var(--surface); border:1px dashed var(--line); border-radius:var(--radius);
  padding:44px 20px; text-align:center;
}
.empty-deck h2{ font-size:1.1rem; font-weight:800; }
.empty-deck p{ font-size:0.84rem; color:var(--muted); margin:8px 0 16px; }

@media (max-width: 1020px){
  .deck-grid{ grid-template-columns:1fr; }
  .detail-grid{ grid-template-columns:1fr; }
  .side-col{ position:static; }
}
@media (max-width: 780px){
  .rail{ display:none; }
  .content{ padding:16px 14px 60px; }
  .topbar{ padding:10px 14px; flex-wrap:wrap; }
}

</head>

<div class="shell">

<script>

/* ════════════════════════════════════════════════════════════════

function parseDate(s){ return new Date(s + "T00:00:00"); }
function toDateStr(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function isBusinessDay(d){
  const dow = d.getDay();
  return dow !== 0 && dow !== 6 && !FEDERAL_HOLIDAYS.has(toDateStr(d));
}
function snapToBusinessDay(dateStr, dir=1){
  if(!dateStr) return dateStr;
  const d = parseDate(dateStr);
  let guard = 0;
  while(!isBusinessDay(d) && guard++ < 10) d.setDate(d.getDate() + dir);
  return toDateStr(d);
}
function addDays(dateStr, n){
  if(!dateStr) return "";
  const d = parseDate(dateStr);
  d.setDate(d.getDate() + n);
  return toDateStr(d);
}
function todayStr(){ return toDateStr(new Date()); }
function daysBetween(a, b){ return Math.round((parseDate(b) - parseDate(a)) / 86400000); }
function fmtDate(s){
  if(!s) return "—";
  return parseDate(s).toLocaleDateString("en-US",{month:"short",day:"numeric"});
}
function fmtDateY(s){
  if(!s) return "—";
  return parseDate(s).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
}

/* ─── State ─── */
let state = load();
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.plans)) return withDefaults(parsed);
    }
    // one-time migration from the legacy LMDC Planner store
    const legacy = localStorage.getItem(LEGACY_PLANS_KEY);
    if(legacy){
      const plans = JSON.parse(legacy);
      if(Array.isArray(plans)) return withDefaults({ plans });
    }
  }catch(e){ console.warn("Could not load saved state", e); }
  return withDefaults({ plans: [] });
}
function withDefaults(s){
  return {
    plans: s.plans || [],
    view: s.view || "deck",
    selectedPlanId: s.selectedPlanId || "",
    collapsed: s.collapsed || {},
    theme: s.theme || ""
  };
}
function persist(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

/* ─── Plan helpers ─── */
function activePlans(){ return state.plans.filter(p => p.status !== "complete"); }
function visiblePlans(){ return state.plans.filter(p => p.status !== "complete" && p.status !== "on_hold"); }
function planById(id){ return state.plans.find(p => p.id === id); }

function taskState(plan, taskId){
  return plan.tasks?.[taskId] || { taskId, status:"open", note:"", updatedAt:"" };
}
function isOneOne(plan){
  if(plan.characteristics?.isOneOnePlan) return true;
  const eff = plan.intake.effectiveDate;
  if(!eff) return false;
  const d = parseDate(eff);
  return d.getMonth() === 0 && d.getDate() === 1;
}
function appliesToPlan(t, plan){
  const r = t.applies, strategies = plan.intake.strategies || [];
  if(r.planTypes && !r.planTypes.includes(plan.intake.planType)) return false;
  if(r.strategiesAny && !r.strategiesAny.some(s => strategies.includes(s))) return false;
  if(r.strategiesAll && !r.strategiesAll.every(s => strategies.includes(s))) return false;
  if(r.strategiesNone && r.strategiesNone.some(s => strategies.includes(s))) return false;
  if(r.excludeCashOnly && strategies.length === 1 && strategies[0] === "cash") return false;
  if(r.excludeTikOnly && strategies.length === 1 && strategies[0] === "tik") return false;
  if(r.characteristics){
    for(const [k,v] of Object.entries(r.characteristics)){
      if(!!(plan.characteristics||{})[k] !== v) return false;
    }
  }
  if(r.excludeOneOne && isOneOne(plan)) return false;
  return true;
}
function applicableTasks(plan){ return TASKS.filter(t => appliesToPlan(t, plan)); }
function taskLabel(plan, t){
  if(t.id === "wire-move-process-wire"){
    const s = plan.intake.strategies || [];
    if(s.includes("cash")) return "Transfer Wire to Advanced Employer";
    if(s.includes("mapping")) return "Map Funds";
  }
  return t.label;
}

function docsAnchor(plan){
  const done = taskState(plan, "setup-all-docs");
  if(done.status === "done" && done.completedAt) return done.completedAt.slice(0,10);
  return plan.intake.caseStartDate || (plan.createdAt || "").slice(0,10) || todayStr();
}
function finalFilesAnchor(plan){
  const ff = taskState(plan, "post-receive-final-files");
  if(ff.status === "done" && ff.completedAt) return ff.completedAt.slice(0,10);
  return plan.intake.wireDate ? addDays(plan.intake.wireDate, SCHED.finalFilesDeadline) : "";
}
function taskDueDate(plan, t){
  const rule = TASK_DUE[t.id];
  if(!rule) return "";
  let base = "";
  if(rule.from === "docs")  base = rule.week != null ? addDays(docsAnchor(plan), rule.week*7) : docsAnchor(plan);
  if(rule.from === "wire")  base = plan.intake.wireDate ? addDays(plan.intake.wireDate, rule.days||0) : "";
  if(rule.from === "final") base = finalFilesAnchor(plan) ? addDays(finalFilesAnchor(plan), rule.days||0) : "";
  return base ? snapToBusinessDay(base, 1) : "";
}

function planProgress(plan){
  const tasks = applicableTasks(plan);
  const eligible = tasks.filter(t => taskState(plan, t.id).status !== "na");
  const done = eligible.filter(t => taskState(plan, t.id).status === "done");
  return { done: done.length, total: eligible.length, pct: eligible.length ? done.length/eligible.length : 0 };
}
function openTasks(plan){
  return applicableTasks(plan)
    .filter(t => ["open","working"].includes(taskState(plan, t.id).status))
    .map(t => ({
      plan, task:t, label: taskLabel(plan, t),
      phase: PHASES.find(p => p.id === t.phaseId)?.label || t.phaseId,
      due: taskDueDate(plan, t),
      status: taskState(plan, t.id).status
    }));
}
function planWarnings(plan){
  const w = [];
  const c = plan.intake.contacts || {};
  if(!c.payroll?.vendorName || !c.payroll?.name) w.push({ msg:"Payroll vendor / contact is missing." });
  if(plan.intake.planType !== "startup" && (!c.priorRecordKeeper?.vendorName || !c.priorRecordKeeper?.name))
    w.push({ msg:"Prior record keeper / contact is missing." });
  if((plan.intake.strategies||[]).includes("tik") && plan.intake.wireDate){
    const d = daysBetween(todayStr(), plan.intake.wireDate);
    if(d >= 0 && d <= 7 && taskState(plan,"prk-tik-account-details").status !== "done")
      w.push({ msg:"Wire is within 7 days and TIK Account Details are not done.", crit:true });
  }
  const pw = payrollWatch(plan);
  if(pw) w.push(pw);
  return w;
}
function payrollWatch(plan){
  const fp = plan.intake.firstPayrollTaDate;
  if(!fp) return null;
  if(taskState(plan, "payroll-finalize").status === "done") return null;
  const d = daysBetween(todayStr(), fp);
  if(d > 14) return null;
  if(d < 0) return { msg:`First payroll passed ${Math.abs(d)}d ago — payroll not handed off.`, crit:true, payroll:true };
  return { msg:`First payroll in ${d}d — Payroll Handoff not done.`, crit: d <= 7, payroll:true };
}
function planHealth(plan){
  const w = planWarnings(plan);
  const overdue = openTasks(plan).some(x => x.due && x.due < todayStr());
  if(overdue || w.some(x => x.crit)) return "crit";
  if(w.length) return "warn";
  return "ok";
}
function updateLifecycle(plan){
  if(taskState(plan,"setup-all-docs").status === "done" && plan.status === "pre_start") plan.status = "active";
  if(taskState(plan,"setup-all-docs").status !== "done" && plan.status === "active") plan.status = "pre_start";
  if(taskState(plan,"close-go-live-meeting").status === "done" && taskState(plan,"payroll-finalize").status === "done"){
    plan.status = "complete";
    plan.archivedAt = plan.archivedAt || new Date().toISOString();
  }
}

/* ─── Rendering ─── */
const $ = id => document.getElementById(id);
function esc(v){
  return String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

const VIEWS = [
  { id:"deck",  label:"Command Deck" },
  { id:"radar", label:"Radar" },
  { id:"sched", label:"Partner Schedule" },
  { id:"proc",  label:"Procedures" },
  { id:"archive", label:"Archive" }
];

function render(){
  renderRail();
  renderTop();
  const c = $("content");
  if(state.view === "deck") c.innerHTML = renderDeck();
  else if(state.view === "radar") c.innerHTML = renderRadar();
  else if(state.view === "sched") c.innerHTML = renderSched();
  else if(state.view === "proc") c.innerHTML = renderProc();
  else if(state.view === "archive") c.innerHTML = renderArchive();
  else if(state.view === "plan") c.innerHTML = renderPlan();
  else c.innerHTML = renderDeck();
}

function renderRail(){
  const overdueTotal = visiblePlans().reduce((n,p)=> n + openTasks(p).filter(x=>x.due && x.due < todayStr()).length, 0);
  $("railNav").innerHTML = VIEWS.map(v => {
    const badge = v.id === "radar" && overdueTotal
      ? `<span class="badge crit">${overdueTotal}</span>` : "";
    return `<button class="rail-btn ${state.view===v.id?"active":""}" onclick="CC.go('${v.id}')">${v.label}${badge}</button>`;
  }).join("");
  const plans = activePlans();
  $("railPlans").innerHTML = `<span class="glbl">Plans</span>` + (plans.length
    ? plans.map(p => {
        const h = planHealth(p);
        const cls = h === "crit" ? "crit" : h === "warn" ? "warn" : "ok";
        const active = state.view === "plan" && state.selectedPlanId === p.id;
        return `<button class="rail-plan ${active?"active":""}" onclick="CC.openPlan('${p.id}')">
          <span class="dot ${cls}"></span><span class="nm">${esc(p.intake.planName || "Untitled")}</span>
        </button>`;
      }).join("")
    : `<div class="panel-empty">No plans yet.</div>`);
}

function renderTop(){
  const labels = Object.fromEntries(VIEWS.map(v=>[v.id, v.label]));
  let crumb = labels[state.view] || "Command Deck";
  if(state.view === "plan"){
    const p = planById(state.selectedPlanId);
    crumb = p ? p.intake.planName : "Plan";
  }
  $("crumb").textContent = crumb;
  $("todayLbl").textContent = new Date().toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});
}

/* ── Deck ── */
function renderDeck(){
  const plans = visiblePlans();
  if(!state.plans.length){
    return `<div class="empty-deck">
      <h2>No plans on deck</h2>
      <p>Add your first plan shell — details can land as the case gets real.</p>
      <button class="btn primary" onclick="CC.openPlanModal()">+ New Plan</button>
    </div>`;
  }
  const all = plans.flatMap(openTasks);
  const today = todayStr();
  const weekEnd = addDays(today, 7);
  const overdue = all.filter(x => x.due && x.due < today).sort((a,b)=>a.due.localeCompare(b.due));
  const thisWeek = all.filter(x => x.due && x.due >= today && x.due <= weekEnd).sort((a,b)=>a.due.localeCompare(b.due));
  const watches = plans.map(p => ({ p, w: payrollWatch(p) })).filter(x => x.w);
  const nextWire = plans.map(p => p.intake.wireDate).filter(d => d && d >= today).sort()[0];

  return `
  <div class="kpi-band">
    <div class="kpi"><div class="k-lbl">Active Plans</div><div class="k-val">${plans.length}</div><div class="k-sub">${state.plans.filter(p=>p.status==="on_hold").length} on hold · ${state.plans.filter(p=>p.status==="complete").length} complete</div></div>
    <div class="kpi ${overdue.length?"crit":"good"}"><div class="k-lbl">Overdue</div><div class="k-val">${overdue.length}</div><div class="k-sub">tasks past due</div></div>
    <div class="kpi ${thisWeek.length?"warn":""}"><div class="k-lbl">Due This Week</div><div class="k-val">${thisWeek.length}</div><div class="k-sub">next 7 days</div></div>
    <div class="kpi ${watches.length?"warn":""}"><div class="k-lbl">Payroll Watch</div><div class="k-val">${watches.length}</div><div class="k-sub">first payroll ≤ 14d out</div></div>
    <div class="kpi"><div class="k-lbl">Next Wire</div><div class="k-val" style="font-size:1.15rem">${nextWire?fmtDate(nextWire):"—"}</div><div class="k-sub">${nextWire?daysBetween(today,nextWire)+"d out":"no wires scheduled"}</div></div>
  </div>

  <div class="deck-grid">
    ${deckPanel("Overdue","crit",overdue.slice(0,8), "Nothing overdue. Clean board.")}
    ${deckPanel("This Week","warn",thisWeek.slice(0,8), "Nothing due in the next 7 days.")}
    ${payrollPanel(watches)}
  </div>

  <div class="cards">${plans.map(cardHtml).join("")}</div>`;
}
function deckPanel(title, tone, items, emptyMsg){
  const color = tone === "crit" ? "var(--crit)" : "var(--warn)";
  return `<div class="panel">
    <div class="panel-hd"><span class="stripe" style="background:${color}"></span><h3>${title}</h3><span class="cnt">${items.length}</span></div>
    <div class="panel-body">${items.length ? items.map(agendaRow).join("") : `<div class="panel-empty">${emptyMsg}</div>`}</div>
  </div>`;
}
function agendaRow(x){
  const today = todayStr();
  const cls = x.due < today ? "crit" : daysBetween(today, x.due) <= 2 ? "warn" : "";
  return `<button class="agenda-row" onclick="CC.openPlan('${x.plan.id}')">
    <span class="when ${cls}">${fmtDate(x.due)}</span>
    <span class="what"><b>${esc(x.label)}</b><span>${esc(x.plan.intake.planName)} · ${esc(x.phase)}</span></span>
  </button>`;
}
function payrollPanel(watches){
  return `<div class="panel">
    <div class="panel-hd"><span class="stripe" style="background:var(--accent)"></span><h3>Payroll Watch</h3><span class="cnt">${watches.length}</span></div>
    <div class="panel-body">${watches.length ? watches.map(({p,w}) => `
      <button class="agenda-row" onclick="CC.openPlan('${p.id}')">
        <span class="when ${w.crit?"crit":"warn"}">${fmtDate(p.intake.firstPayrollTaDate)}</span>
        <span class="what"><b>${esc(p.intake.planName)}</b><span>${esc(w.msg)}</span></span>
      </button>`).join("") : `<div class="panel-empty">No first-payroll dates inside 14 days.</div>`}</div>
  </div>`;
}
function cardHtml(p){
  const prog = planProgress(p);
  const warns = planWarnings(p);
  const today = todayStr();
  const chips = [];
  if(p.intake.effectiveDate) chips.push(dchip("EFF", p.intake.effectiveDate, today));
  if(p.intake.wireDate) chips.push(dchip("WIRE", p.intake.wireDate, today));
  if(p.intake.firstPayrollTaDate) chips.push(dchip("PAY-1", p.intake.firstPayrollTaDate, today));
  return `<article class="card">
    <div class="card-top">
      <div style="min-width:0;flex:1">
        <button class="ttl" onclick="CC.openPlan('${p.id}')">${esc(p.intake.planName || "Untitled Plan")}</button>
        <div class="case">${esc(p.intake.caseNumber || "no case #")} · ${esc(typeLabel(p))}</div>
      </div>
      <span class="pill ${pillClass(p.status)}">${statusLabel(p.status)}</span>
    </div>
    <div class="card-dates">${chips.join("")}</div>
    <div>
      <div class="prog-lbl"><span>Progress</span><b>${prog.done}/${prog.total}</b></div>
      <div class="progress" style="margin-top:4px"><i style="width:${Math.round(prog.pct*100)}%"></i></div>
    </div>
    ${warns.length?`<div class="card-warns">${warns.map(w=>`<div class="cwarn ${w.crit?"crit":""}">${esc(w.msg)}</div>`).join("")}</div>`:""}
    <div class="card-foot">
      <button class="btn sm" onclick="CC.openPlan('${p.id}')">Open</button>
      <button class="btn sm ghost" onclick="CC.openPlanModal('${p.id}')">Edit</button>
      <button class="btn sm ghost" onclick="CC.toggleHold('${p.id}')">${p.status==="on_hold"?"Resume":"Hold"}</button>
    </div>
  </article>`;
}
function dchip(lbl, date, today){
  const d = daysBetween(today, date);
  const cls = d < 0 ? "" : d <= 3 ? "crit" : d <= 10 ? "warn" : "";
  return `<span class="datechip ${cls}">${lbl} <b>${fmtDate(date)}</b>${d>=0?` · ${d}d`:""}</span>`;
}
function typeLabel(p){
  let t = p.intake.planType;
  t = t.charAt(0).toUpperCase() + t.slice(1);
  if(p.intake.planType === "merger" && p.intake.mergerType) t += ` (${p.intake.mergerType})`;
  const s = (p.intake.strategies||[]).map(x => ({cash:"Cash",mapping:"Map",tik:"TIK"})[x] || x).join(" + ");
  return s ? `${t} · ${s}` : t;
}
function statusLabel(s){ return ({pre_start:"Pre-Start",active:"Active",on_hold:"On Hold",complete:"Complete"})[s] || s; }
function pillClass(s){ return ({pre_start:"pre",active:"active",on_hold:"hold",complete:"done"})[s] || "pre"; }

/* ── Plan detail ── */
function renderPlan(){
  const p = planById(state.selectedPlanId);
  if(!p) return `<div class="empty-deck"><h2>Plan not found</h2><p>It may have been removed.</p><button class="btn" onclick="CC.go('deck')">Back to Deck</button></div>`;
  const prog = planProgress(p);
  const tasks = applicableTasks(p);
  const grouped = PHASES.map(ph => ({ ...ph, tasks: tasks.filter(t => t.phaseId === ph.id) })).filter(g => g.tasks.length);
  const today = todayStr();

  const cds = [];
  if(p.intake.wireDate) cds.push(cdown("Wire", p.intake.wireDate, today));
  if(p.intake.effectiveDate) cds.push(cdown("Effective", p.intake.effectiveDate, today));
  if(p.intake.firstPayrollTaDate) cds.push(cdown("First Payroll", p.intake.firstPayrollTaDate, today));
  const ffA = finalFilesAnchor(p);
  if(ffA && p.intake.planType !== "startup") cds.push(cdown("Final Files", ffA, today));

  const warns = planWarnings(p);

  return `
  <div class="plan-hd">
    <div class="row1">
      <div style="flex:1;min-width:240px">
        <h2>${esc(p.intake.planName)}</h2>
        <div class="case" style="font-family:var(--mono);font-size:0.76rem;color:var(--muted);margin-top:4px">
          ${esc(p.intake.caseNumber || "no case #")} · ${esc(typeLabel(p))} · <span class="pill ${pillClass(p.status)}">${statusLabel(p.status)}</span>
        </div>
      </div>
      <button class="btn sm" onclick="CC.openPlanModal('${p.id}')">Edit Intake</button>
      <button class="btn sm ghost" onclick="CC.toggleHold('${p.id}')">${p.status==="on_hold"?"Resume":"Hold"}</button>
    </div>
    <div class="meta">${cds.join("")}
      <div class="countdown"><span class="c-lbl">Progress</span><span class="c-val">${prog.done}/${prog.total}</span><span class="c-sub">${Math.round(prog.pct*100)}% done</span></div>
    </div>
    ${warns.length?`<div class="card-warns" style="margin-top:10px;max-width:560px">${warns.map(w=>`<div class="cwarn ${w.crit?"crit":""}">${esc(w.msg)}</div>`).join("")}</div>`:""}
  </div>

  <div class="detail-grid">
    <div class="phase-list">
      ${grouped.map(g => phaseHtml(p, g)).join("")}
    </div>
    <div class="side-col">
      ${sidePanels(p)}
    </div>
  </div>`;
}
function cdown(lbl, date, today){
  const d = daysBetween(today, date);
  const cls = d < 0 ? "" : d <= 3 ? "crit" : d <= 10 ? "warn" : "good";
  const sub = d === 0 ? "today" : d > 0 ? `in ${d}d` : `${Math.abs(d)}d ago`;
  return `<div class="countdown ${cls}"><span class="c-lbl">${lbl}</span><span class="c-val">${fmtDateY(date)}</span><span class="c-sub">${sub}</span></div>`;
}
function phaseHtml(p, g){
  const done = g.tasks.filter(t => taskState(p, t.id).status === "done").length;
  const eligible = g.tasks.filter(t => taskState(p, t.id).status !== "na").length;
  const collapsed = state.collapsed[p.id + ":" + g.id] ?? (done === eligible && eligible > 0);
  return `<section class="phase-card ${collapsed?"collapsed":""}">
    <button class="phase-hd" onclick="CC.togglePhase('${p.id}','${g.id}')" aria-expanded="${!collapsed}">
      <span class="ph-num">${g.num}</span><h3>${g.label}</h3>
      <span class="ph-cnt">${done}/${eligible}</span>
      <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="phase-mini">${eligible?`<i style="width:${Math.round(done/eligible*100)}%"></i>`:""}</div>
    <div class="phase-body">
      ${g.tasks.map(t => taskRow(p, t)).join("")}
    </div>
  </section>`;
}
function taskRow(p, t){
  const st = taskState(p, t.id);
  const due = taskDueDate(p, t);
  const today = todayStr();
  const dueCls = !due || ["done","na"].includes(st.status) ? "" : due < today ? "crit" : daysBetween(today,due) <= 2 ? "warn" : "";
  const label = taskLabel(p, t);
  const warn = warnFor(p, t);
  const noteOpen = state["noteOpen:" + p.id + ":" + t.id];
  return `<div class="trow ${st.status==="done"?"is-done":""} ${st.status==="na"?"is-na":""}">
    <div class="trow-main">
      <div style="min-width:0">
        <div class="t-name">${esc(label)}</div>
        <div class="t-sub">${esc(t.description || "")}${due?` <span class="t-due ${dueCls}">due ${fmtDate(due)}</span>`:""}</div>
        ${warn?`<div class="trow-warn">${esc(warn)}</div>`:""}
      </div>
      <div class="t-ctrl">
        ${stBtn(p.id,t.id,st.status,"open","Open")}
        ${stBtn(p.id,t.id,st.status,"working","Wkg")}
        ${stBtn(p.id,t.id,st.status,"done","Done")}
        ${t.allowNA?stBtn(p.id,t.id,st.status,"na","N/A"):""}
      </div>
    </div>
    <button class="note-toggle ${st.note?"has-note":""}" onclick="CC.toggleNote('${p.id}','${t.id}')">${st.note?"✎ note":"+ note"}</button>
    ${noteOpen||st.note?`<div class="t-note"><textarea rows="1" placeholder="Two sentences max — future-you will thank you."
      oninput="CC.setNote('${p.id}','${t.id}',this.value)">${esc(st.note||"")}</textarea></div>`:""}
  </div>`;
}
function stBtn(pid, tid, cur, val, lbl){
  return `<button class="stbtn ${cur===val?"on-"+val:""}" onclick="CC.setStatus('${pid}','${tid}','${val}')">${lbl}</button>`;
}
function warnFor(p, t){
  const docsDone = taskState(p,"setup-all-docs").status === "done";
  if(!docsDone && ["setup-base-template","setup-payroll-template","payroll-complete-template","prep-fund-mapping"].includes(t.id))
    return t.warning || "Usually waits for Obtain All Documents.";
  return "";
}
function sidePanels(p){
  const c = p.intake.contacts || {};
  const hist = (p.dateHistory || []).slice(-5).reverse();
  const d1 = p.intake.caseStartDate;
  const milestones = [];
  if(d1 || p.intake.wireDate || p.intake.effectiveDate){
    for(const m of PARTNER_SCHEDULE){
      if(m.tik && !(p.intake.strategies||[]).includes("tik")) continue;
      if(m.merger && p.intake.planType !== "merger") continue;
      let base = m.anchor === "D1" ? d1 : m.anchor === "EFF" ? p.intake.effectiveDate : p.intake.wireDate;
      if(!base) continue;
      milestones.push({ label:m.label, date: snapToBusinessDay(addDays(base, m.off), 1) });
    }
    milestones.sort((a,b)=>a.date.localeCompare(b.date));
  }
  const today = todayStr();
  const nextIdx = milestones.findIndex(m => m.date >= today);
  const around = milestones.length
    ? milestones.slice(Math.max(0, (nextIdx<0?milestones.length:nextIdx)-2), (nextIdx<0?milestones.length:nextIdx)+6)
    : [];

  return `
  <div class="side-panel">
    <h4>Contacts</h4>
    <div class="kv"><span class="k">Payroll</span><span class="v">${esc(c.payroll?.vendorName||"—")}</span></div>
    ${c.payroll?.name?`<div class="kv"><span class="k"></span><span class="v" style="font-weight:500">${esc(c.payroll.name)}${c.payroll.email?` · ${esc(c.payroll.email)}`:""}</span></div>`:""}
    <div class="kv"><span class="k">Prior RK</span><span class="v">${esc(c.priorRecordKeeper?.vendorName||"—")}</span></div>
    ${c.priorRecordKeeper?.name?`<div class="kv"><span class="k"></span><span class="v" style="font-weight:500">${esc(c.priorRecordKeeper.name)}${c.priorRecordKeeper.email?` · ${esc(c.priorRecordKeeper.email)}`:""}</span></div>`:""}
    ${p.intake.clientFolderUrl?`<div class="kv"><span class="k">Folder</span><span class="v"><a href="${esc(p.intake.clientFolderUrl)}" target="_blank" rel="noopener" style="color:var(--accent)">open ↗</a></span></div>`:""}
  </div>
  ${around.length?`<div class="side-panel">
    <h4>Partner Timeline</h4>
    <div class="milestones">
      ${around.map(m=>{
        const past = m.date < today;
        const next = !past && m.date === (milestones[nextIdx]||{}).date;
        return `<div class="mst ${past?"past":""} ${next?"next":""}">
          <span class="m-dot"></span><span class="m-date">${fmtDate(m.date)}</span><span class="m-lbl">${esc(m.label)}</span>
        </div>`;
      }).join("")}
    </div>
  </div>`:`<div class="side-panel"><h4>Partner Timeline</h4><div class="panel-empty" style="padding:4px 0">Set a Case Start (Day 1) date to project the partner schedule.</div></div>`}
  <div class="side-panel">
    <h4>Plan Notes</h4>
    <textarea oninput="CC.setPlanNotes('${p.id}',this.value)" placeholder="Running notes for this plan…">${esc(p.notes||"")}</textarea>
  </div>
  ${hist.length?`<div class="side-panel"><h4>Date History</h4><div class="hist">${hist.map(h=>`${esc(fieldLabel(h.field))} → <b>${fmtDateY(h.newDate)}</b>`).join("<br>")}</div></div>`:""}`;
}
function fieldLabel(f){
  return ({effectiveDate:"Effective Date",wireDate:"Wire Date",firstPayrollTaDate:"First Payroll",caseStartDate:"Case Start"})[f] || f;
}

/* ── Radar (all upcoming, grouped by day) ── */
function renderRadar(){
  const all = visiblePlans().flatMap(openTasks).filter(x => x.due).sort((a,b)=>a.due.localeCompare(b.due));
  if(!all.length) return `<div class="empty-deck"><h2>Radar is clear</h2><p>No dated tasks on active plans.</p></div>`;
  const today = todayStr();
  const groups = new Map();
  for(const x of all){
    const key = x.due < today ? "OVERDUE" : x.due;
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(x);
  }
  let html = "";
  for(const [key, items] of groups){
    const overdue = key === "OVERDUE";
    const lbl = overdue ? "Overdue" : parseDate(key).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
    const rel = overdue ? `${items.length} task${items.length===1?"":"s"}` :
      key === today ? "today" : `in ${daysBetween(today,key)}d`;
    html += `<div class="radar-day">
      <div class="rd-hd ${overdue?"overdue":""}"><b>${lbl}</b><span>${rel}</span></div>
      <div class="panel"><div class="panel-body">${items.map(agendaRow).join("")}</div></div>
    </div>`;
  }
  return html;
}

/* ── Partner Schedule reference ── */
function renderSched(){
  return `
  <p class="sched-note">The partner schedule drives expectations with the client, payroll vendor, and prior record keeper.
  Offsets are calendar days from the anchor — <b>D1</b> is case start, <b>EFF</b> effective date, <b>WIRE</b> wire date.
  Dates on each plan's Partner Timeline snap forward to the next business day (weekends + federal holidays).</p>
  <div class="sched-wrap">
  <table class="sched">
    <thead><tr><th>Phase</th><th>Milestone</th><th>Anchor</th><th>Offset</th></tr></thead>
    <tbody>
      ${PARTNER_SCHEDULE.map(m=>`<tr>
        <td class="ph">${esc(m.phase)}</td>
        <td>${esc(m.label)}${m.tik?" <span style='color:var(--accent);font-weight:700;font-size:0.7rem'>TIK</span>":""}${m.merger?" <span style='color:var(--muted);font-weight:700;font-size:0.7rem'>MERGER</span>":""}</td>
        <td class="off">${m.anchor}</td>
        <td class="off">${m.off>0?"+":""}${m.off}d</td>
      </tr>`).join("")}
    </tbody>
  </table>
  </div>`;
}

/* ── Procedures ── */
const PROCEDURES = [
  { file:"Census.html", name:"Census", desc:"Participant census load procedure" },
  { file:"Elections.html", name:"Elections", desc:"Investment elections load" },
  { file:"Source-Mapping.html", name:"Source Mapping", desc:"Map prior RK sources to TA" },
  { file:"Fund-Mapping.html", name:"Fund Mapping", desc:"Map prior funds to the new lineup" },
  { file:"Cash-Conversion.html", name:"Cash Conversion", desc:"Balance import — cash strategy" },
  { file:"Mapping.html", name:"Mapping", desc:"Balance import — mapping strategy" },
  { file:"Transfer-In-Kind.html", name:"Transfer In-Kind", desc:"Balance import — TIK strategy" }
];
function renderProc(){
  return `<p class="sched-note">Step-by-step procedures from the planner library. Links open the repo copies under <span style="font-family:var(--mono)">/procedures</span> when this page is served from the live site.</p>
  <div class="proc-grid">
    ${PROCEDURES.map(x=>`<a class="proc-card" href="procedures/${x.file}"><b>${esc(x.name)}</b><span>${esc(x.desc)}</span></a>`).join("")}
  </div>`;
}

/* ── Archive ── */
function renderArchive(){
  const done = state.plans.filter(p => p.status === "complete");
  if(!done.length) return `<div class="empty-deck"><h2>Archive is empty</h2><p>Completed plans land here when Go-Live and Payroll Handoff are both done.</p></div>`;
  return `<div class="cards">${done.map(p=>`
    <article class="card">
      <div class="card-top">
        <div style="min-width:0;flex:1">
          <button class="ttl" onclick="CC.openPlan('${p.id}')">${esc(p.intake.planName)}</button>
          <div class="case">${esc(p.intake.caseNumber||"no case #")} · completed ${p.archivedAt?fmtDateY(p.archivedAt.slice(0,10)):"—"}</div>
        </div>
        <span class="pill done">Complete</span>
      </div>
      <div class="card-foot">
        <button class="btn sm ghost" onclick="CC.reopenPlan('${p.id}')">Reopen</button>
      </div>
    </article>`).join("")}</div>`;
}

/* ─── Actions ─── */
const CC = {
  go(view){ state.view = view; persist(); render(); window.scrollTo(0,0); },
  openPlan(id){ state.view = "plan"; state.selectedPlanId = id; persist(); render(); window.scrollTo(0,0); },
  togglePhase(pid, phid){
    const k = pid + ":" + phid;
    state.collapsed[k] = !(state.collapsed[k] ?? false);
    persist(); render();
  },
  toggleNote(pid, tid){
    const k = "noteOpen:" + pid + ":" + tid;
    state[k] = !state[k];
    render();
  },
  setStatus(pid, tid, status){
    const p = planById(pid); if(!p) return;
    const st = taskState(p, tid);
    st.status = st.status === status && status !== "done" ? "open" : status;
    st.updatedAt = new Date().toISOString();
    st.completedAt = st.status === "done" ? st.updatedAt : "";
    p.tasks = p.tasks || {};
    p.tasks[tid] = st;
    p.updatedAt = st.updatedAt;
    updateLifecycle(p);
    persist(); render();
  },
  setNote(pid, tid, note){
    const p = planById(pid); if(!p) return;
    const st = taskState(p, tid);
    st.note = note; st.updatedAt = new Date().toISOString();
    p.tasks = p.tasks || {}; p.tasks[tid] = st;
    persist();
  },
  setPlanNotes(pid, notes){
    const p = planById(pid); if(!p) return;
    p.notes = notes; p.updatedAt = new Date().toISOString();
    persist();
  },
  toggleHold(pid){
    const p = planById(pid); if(!p) return;
    p.status = p.status === "on_hold" ? "active" : "on_hold";
    p.updatedAt = new Date().toISOString();
    persist(); render();
  },
  reopenPlan(pid){
    const p = planById(pid); if(!p) return;
    p.status = "active"; p.archivedAt = "";
    persist(); render();
  },

  openPlanModal(id=""){
    const p = planById(id);
    $("planForm").reset();
    $("f_id").value = p?.id || "";
    $("planModalTitle").textContent = p ? "Edit Plan" : "New Plan";
    if(p){
      $("f_name").value = p.intake.planName || "";
      $("f_case").value = p.intake.caseNumber || "";
      $("f_type").value = p.intake.planType || "conversion";
      $("f_merger").value = p.intake.mergerType || "";
      $("f_caseStart").value = p.intake.caseStartDate || "";
      $("f_eff").value = p.intake.effectiveDate || "";
      $("f_wire").value = p.intake.wireDate || "";
      $("f_payroll").value = p.intake.firstPayrollTaDate || "";
      document.querySelectorAll("[name=strategy]").forEach(i => i.checked = (p.intake.strategies||[]).includes(i.value));
      $("f_oneone").checked = !!p.characteristics?.isOneOnePlan;
      $("f_auto").checked = !!p.characteristics?.autoEnroll;
      $("f_loans").checked = !!p.characteristics?.loans;
      $("f_roth").checked = !!p.characteristics?.roth;
      $("f_nonqual").checked = !!p.characteristics?.nonQual;
      const c = p.intake.contacts || {};
      $("f_pv").value = c.payroll?.vendorName || "";
      $("f_pn").value = c.payroll?.name || "";
      $("f_pe").value = c.payroll?.email || "";
      $("f_rv").value = c.priorRecordKeeper?.vendorName || "";
      $("f_rn").value = c.priorRecordKeeper?.name || "";
      $("f_re").value = c.priorRecordKeeper?.email || "";
      $("f_folder").value = p.intake.clientFolderUrl || "";
      $("f_notes").value = p.notes || "";
    } else {
      $("f_type").value = "conversion";
      $("f_caseStart").value = todayStr();
    }
    CC.syncTypeFields();
    $("planModal").classList.add("open");
    $("planModal").setAttribute("aria-hidden","false");
    setTimeout(()=>$("f_name").focus(), 0);
  },
  closePlanModal(){
    $("planModal").classList.remove("open");
    $("planModal").setAttribute("aria-hidden","true");
  },
  syncTypeFields(){
    const t = $("f_type").value;
    $("f_mergerWrap").classList.toggle("hidden", t !== "merger");
    $("f_stratWrap").classList.toggle("hidden", t === "startup");
  },
  savePlan(ev){
    ev.preventDefault();
    const id = $("f_id").value || (crypto.randomUUID ? crypto.randomUUID() : "p" + Date.now());
    const existing = planById(id);
    const now = new Date().toISOString();
    const planType = $("f_type").value;
    const strategies = [...document.querySelectorAll("[name=strategy]:checked")].map(i=>i.value);
    if(planType !== "startup" && !strategies.length){ toast("Pick at least one conversion strategy."); return; }
    if(planType === "merger" && !$("f_merger").value){ toast("Pick a merger type."); return; }

    const oldIntake = existing?.intake || {};
    const next = existing ? structuredClone(existing) : { id, createdAt: now, status:"pre_start", tasks:{}, dateHistory:[] };
    next.updatedAt = now;
    next.intake = {
      planName: $("f_name").value.trim(),
      caseNumber: $("f_case").value.trim(),
      planType,
      mergerType: planType === "merger" ? $("f_merger").value : "",
      strategies: planType === "startup" ? [] : strategies,
      caseStartDate: $("f_caseStart").value,
      effectiveDate: $("f_eff").value,
      firstPayrollTaDate: $("f_payroll").value,
      wireDate: planType === "startup" ? "" : $("f_wire").value,
      clientFolderUrl: $("f_folder").value.trim(),
      contacts: {
        payroll: { vendorName:$("f_pv").value.trim(), name:$("f_pn").value.trim(), email:$("f_pe").value.trim() },
        priorRecordKeeper: { vendorName:$("f_rv").value.trim(), name:$("f_rn").value.trim(), email:$("f_re").value.trim() }
      }
    };
    next.characteristics = {
      isOneOnePlan: $("f_oneone").checked,
      autoEnroll: $("f_auto").checked,
      loans: $("f_loans").checked,
      roth: $("f_roth").checked,
      nonQual: $("f_nonqual").checked
    };
    next.notes = $("f_notes").value;
    next.dateHistory = [
      ...(next.dateHistory || []),
      ...["effectiveDate","wireDate","firstPayrollTaDate","caseStartDate"]
        .filter(f => oldIntake[f] && oldIntake[f] !== next.intake[f])
        .map(f => ({ field:f, newDate: next.intake[f], changedAt: now }))
    ];
    updateLifecycle(next);
    const i = state.plans.findIndex(x => x.id === id);
    if(i >= 0) state.plans[i] = next; else state.plans.push(next);
    state.selectedPlanId = id;
    state.view = "plan";
    persist();
    CC.closePlanModal();
    render();
    toast(existing ? "Plan updated" : "Plan created");
  },

  exportJson(){
    const payload = { exportVersion:1, exportedAt:new Date().toISOString(), appName:"LMDC Command Center", plans: state.plans };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `lmdc-command-center-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast("Exported " + state.plans.length + " plan(s)");
  },
  importJson(ev){
    const file = ev.target.files?.[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        if(!data || data.exportVersion !== 1 || !Array.isArray(data.plans)) throw new Error("bad format");
        state.plans = data.plans;
        state.selectedPlanId = "";
        state.view = "deck";
        persist(); render();
        toast("Imported " + data.plans.length + " plan(s)");
      }catch(e){ toast("Could not import that file — expected an exportVersion 1 JSON."); }
    };
    reader.readAsText(file);
    ev.target.value = "";
  },
  toggleTheme(){
    const cur = document.documentElement.getAttribute("data-theme")
      || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    state.theme = next; persist();
  }
};

let toastTimer;
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2600);
}

/* ─── Boot ─── */
document.addEventListener("DOMContentLoaded", () => {
  if(state.theme) document.documentElement.setAttribute("data-theme", state.theme);
  $("planForm").addEventListener("submit", CC.savePlan);
  $("f_type").addEventListener("change", CC.syncTypeFields);
  $("importInput").addEventListener("change", CC.importJson);
  $("themeBtn").addEventListener("click", CC.toggleTheme);
  $("planModal").addEventListener("click", e => { if(e.target === $("planModal")) CC.closePlanModal(); });
  document.addEventListener("keydown", e => {
    if(e.key === "Escape") CC.closePlanModal();
  });
  render();
});
window.CC = CC;
</script>
</body>

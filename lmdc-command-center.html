  /* --faint deviates from the System C spec value #8b96a7 on purpose: small
     mono fine print reads better with the extra contrast on white. (Eyebrows
     themselves take --muted — see .eyebrow — since they carry real labels.) */
  --text:#1a2130;--muted:#5c6a7e;--faint:#76839a;
  --accent:#0f6cbd;--accent-strong:#0b5394;--accent-soft:#e8f1fb;--accent-line:#b3d1ee;
  --accent-contrast:#ffffff;
  --ph-pre_start:#8b96a7;--ph-setup:#0f6cbd;--ph-payroll:#6b5bd2;--ph-prk:#0e8074;
  --ph-preparation:#3d7d23;--ph-wire_day:#c26a00;--ph-post_wire:#a63d6f;
  --ph-data_load:#8250c8;--ph-closeout:#5c6a7e;
  --ok:#0e7c3a;--ok-soft:#e5f4ea;--ok-line:#b7dfc5;
  --warn:#a35a00;--warn-soft:#fdf1e0;--warn-line:#eed3a8;
  --danger:#c22f26;--danger-soft:#fceceb;--danger-line:#f2c4c0;
  --wait:#5c6a7e;--wait-soft:#eef1f5;--wait-line:#d5dbe3;
  --violet:#8250c8;--violet-soft:#f0e9fa;--violet-line:#d5c2ef;
  --sh1:0 1px 2px rgba(16,24,40,.05);
  --sh2:0 2px 4px rgba(16,24,40,.05),0 4px 12px rgba(16,24,40,.07);
  --sh3:0 8px 16px rgba(16,24,40,.08),0 16px 40px rgba(16,24,40,.12);
  --rail-bg:#161d29;--rail-bg2:#1c2432;--rail-border:#28324230;
  --rail-text:#e8edf4;--rail-muted:#8b98ab;--rail-active:#233247;
  --scrim:rgba(20,26,36,.44);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d1117;--surface:#161d27;--surface2:#1b2330;--surface3:#212b3a;
  --border:#2a3547;--border-strong:#3b4860;
  --text:#e7ecf3;--muted:#9aa8bc;--faint:#8290a6;
  --accent:#4da3e8;--accent-strong:#7cbdf0;--accent-soft:#152a40;--accent-line:#2a5a8c;
  --accent-contrast:#0d1117;
  --ph-pre_start:#93a1b6;--ph-setup:#5aabee;--ph-payroll:#a293f2;--ph-prk:#3bbcab;
  --ph-preparation:#85c25a;--ph-wire_day:#e79a45;--ph-post_wire:#e07a9e;
  --ph-data_load:#b491ec;--ph-closeout:#98a7bd;
  --ok:#42c078;--ok-soft:#122b1c;--ok-line:#1f5233;
  --warn:#e5a44e;--warn-soft:#2e2312;--warn-line:#5b451f;
  --danger:#f07a6f;--danger-soft:#331a18;--danger-line:#63302a;
  --wait:#9aa8bc;--wait-soft:#212b3a;--wait-line:#3b4860;
  --violet:#ab84e8;--violet-soft:#261b3c;--violet-line:#4a3670;
  --sh1:0 1px 2px rgba(0,0,0,.3);
  --sh2:0 2px 6px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.3);
  --sh3:0 10px 24px rgba(0,0,0,.45),0 20px 48px rgba(0,0,0,.4);
  --rail-bg:#10151d;--rail-bg2:#141b25;--rail-border:#2a354770;
  --rail-text:#e7ecf3;--rail-muted:#8592a6;--rail-active:#22304a;
  --scrim:rgba(2,5,10,.62);
}

html,body{height:100%}
body{
  font-family:var(--sans);font-size:14px;line-height:1.45;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-xs)}
::placeholder{color:var(--faint)}

/* ---------- eyebrow / mono label language ---------- */
/* Eyebrows carry real information (KPI titles, date-tile labels, section
   heads), so they take --muted — comfortably past the 4.5:1 small-text bar in
   both themes. --faint stays for genuinely decorative fine print. */
.eyebrow{
  font-family:var(--mono);font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:.12em;color:var(--muted);
}
.mono{font-family:var(--mono)}

/* ---------- app shell ---------- */
.app{display:flex;height:100vh;overflow:hidden}
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.view-root{flex:1;overflow-y:auto;padding:22px 26px 60px;scroll-behavior:smooth}

/* ---------- left rail ---------- */
.rail{
  width:var(--rail-w);flex:0 0 auto;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--rail-bg),var(--rail-bg2));
  color:var(--rail-text);transition:width .22s ease;overflow:hidden;
  border-right:1px solid var(--rail-border);
}
.app.rail-collapsed .rail{width:var(--rail-w-collapsed)}
.rail-brand{display:flex;align-items:center;gap:11px;padding:18px 16px 16px;border-bottom:1px solid var(--rail-border);min-height:74px}
.brand-mark{
  flex:0 0 30px;width:30px;height:30px;border-radius:8px;
  background:linear-gradient(135deg,#0f6cbd,#0b5394);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:700;font-size:11px;color:#fff;letter-spacing:.05em;
  box-shadow:0 2px 8px rgba(15,108,189,.5);
}
.brand-text{min-width:0;white-space:nowrap}
.brand-text .eyebrow{color:var(--rail-muted);display:block;margin-bottom:2px}
.brand-text strong{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.app.rail-collapsed .brand-text{display:none}
.rail-nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.rail-section{margin:14px 8px 6px;color:var(--rail-muted)}
.app.rail-collapsed .rail-section{visibility:hidden;height:10px;margin:8px 0 2px}
.rail-btn{
  display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-md);
  color:var(--rail-muted);font-weight:500;font-size:13.5px;text-align:left;white-space:nowrap;
  transition:background .12s,color .12s;width:100%;
}
.rail-btn svg{flex:0 0 20px;width:20px;height:20px}
.rail-btn:hover{background:rgba(255,255,255,.06);color:var(--rail-text)}
.rail-btn.active{background:var(--rail-active);color:var(--rail-text);font-weight:600}
.rail-btn .rail-count{
  margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:600;
  background:rgba(255,255,255,.1);border-radius:99px;padding:1px 7px;
}
.rail-btn .rail-count.hot{background:#c22f26;color:#fff}
.app.rail-collapsed .rail-btn span,.app.rail-collapsed .rail-btn .rail-count{display:none}
.app.rail-collapsed .rail-btn{justify-content:center;padding:9px 0}
/* Selected-plan scent under the Plan Detail nav entry */
.rail-sub{
  display:block;font-family:var(--mono);font-size:9.5px;font-weight:500;
  letter-spacing:.05em;color:var(--rail-muted);max-width:148px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;
}
.rail-sub[hidden]{display:none}
.rail-foot{padding:12px 10px;border-top:1px solid var(--rail-border)}

/* ---------- topbar ---------- */
.topbar{
  display:flex;align-items:center;gap:14px;
  padding:14px 26px;border-bottom:1px solid var(--border);
  background:var(--surface);flex-wrap:wrap;min-height:64px;
}
.topbar-title h1{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.topbar-title .eyebrow{display:block;margin-bottom:1px}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:9px}
.today-chip{
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);
  background:var(--surface3);border:1px solid var(--border);border-radius:99px;padding:5px 12px;
  white-space:nowrap;
}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;
  border-radius:var(--r-md);font-weight:600;font-size:13px;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--text);
  box-shadow:var(--sh1);transition:background .12s,border-color .12s,transform .06s;
  white-space:nowrap;
}
.btn:hover{background:var(--surface2);border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
a.btn{text-decoration:none;color:var(--text)}
.btn-primary{background:var(--accent);border-color:var(--accent-strong);color:var(--accent-contrast)}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn-danger{color:var(--danger);border-color:var(--danger-line)}
.btn-danger:hover{background:var(--danger-soft)}
.btn-sm{padding:5px 10px;font-size:12px}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:var(--r-md);
  border:1px solid var(--border-strong);background:var(--surface);color:var(--muted);
  transition:background .12s,color .12s;
}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.icon-btn svg{width:17px;height:17px}

/* ---------- pills / badges / chips ---------- */
.pill{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:.08em;
  border-radius:99px;padding:3px 9px;border:1px solid transparent;white-space:nowrap;
}
.pill-ok{color:var(--ok);background:var(--ok-soft);border-color:var(--ok-line)}
.pill-warn{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)}
.pill-danger{color:var(--danger);background:var(--danger-soft);border-color:var(--danger-line)}
.pill-wait{color:var(--wait);background:var(--wait-soft);border-color:var(--wait-line)}
.pill-accent{color:var(--accent-strong);background:var(--accent-soft);border-color:var(--accent-line)}
.pill-violet{color:var(--violet);background:var(--violet-soft);border-color:var(--violet-line)}
.pill-plain{color:var(--muted);background:var(--surface3);border-color:var(--border)}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}

.type-badge{
  display:inline-flex;align-items:center;font-family:var(--mono);font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.1em;border-radius:var(--r-xs);padding:3px 8px;
  border:1px solid transparent;
}
.type-startup{color:var(--accent-strong);background:var(--accent-soft);border-color:var(--accent-line)}
.type-conversion{color:var(--ok);background:var(--ok-soft);border-color:var(--ok-line)}
.type-merger{color:var(--violet);background:var(--violet-soft);border-color:var(--violet-line)}
.chip{
  display:inline-flex;align-items:center;font-family:var(--mono);font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  background:var(--surface3);border:1px solid var(--border);border-radius:var(--r-xs);padding:2px 7px;
}

/* ---------- cards / panels ---------- */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--sh1);
}
.section-head{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.section-head:first-child{margin-top:0}
.section-head h2{font-size:15px;font-weight:700;letter-spacing:-.01em}
.section-head .eyebrow{position:relative;top:-1px}

/* ---------- KPI tiles ---------- */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
/* Mid widths would auto-fit 5+1 with an orphaned tile — wrap the six KPIs 3+3. */
@media (min-width:641px) and (max-width:1180px){.kpi-row{grid-template-columns:repeat(3,1fr)}}
.kpi{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:14px 16px;box-shadow:var(--sh1);display:flex;flex-direction:column;gap:6px;
  position:relative;overflow:hidden;
}
button.kpi{cursor:pointer;text-align:left;transition:border-color .12s,box-shadow .12s}
button.kpi:hover{border-color:var(--border-strong);box-shadow:var(--sh2)}
.kpi::after{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--border-strong)}
.kpi.k-ok::after{background:var(--ok)}.kpi.k-warn::after{background:var(--warn)}
.kpi.k-danger::after{background:var(--danger)}.kpi.k-wait::after{background:var(--wait)}
.kpi.k-accent::after{background:var(--accent)}.kpi.k-violet::after{background:var(--violet)}
.kpi-value{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:11.5px;color:var(--muted)}

/* ---------- attention lanes ---------- */
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:12px;align-items:start}
@media (min-width:1360px){.lanes{grid-template-columns:repeat(5,1fr)}}
/* Between 1101–1359px five lanes would wrap 4+1 with a hole — wrap 3+2 instead. */
@media (min-width:1101px) and (max-width:1359px){.lanes{grid-template-columns:repeat(3,1fr)}}
.lane{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh1);overflow:hidden;min-height:180px}
.lane.flash-lane,.plan-grid.flash-lane{box-shadow:0 0 0 2.5px var(--accent-line);transition:box-shadow .2s}
.lane-head{
  display:flex;align-items:center;gap:8px;padding:10px 13px;
  border-bottom:1px solid var(--border);background:var(--surface2);
}
.lane-head .eyebrow{color:var(--muted)}
.lane-head .lane-count{
  margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:700;
  border-radius:99px;padding:1px 8px;background:var(--surface3);color:var(--muted);
}
.lane.hot .lane-head .lane-count{background:var(--danger-soft);color:var(--danger)}
.lane-head .lane-note{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.03em}
.lane-body{padding:6px 6px 12px;display:flex;flex-direction:column;gap:4px;max-height:320px;overflow-y:auto}
.lane-body.has-more:not(.at-end){
  -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 40px),transparent);
  mask-image:linear-gradient(180deg,#000 calc(100% - 40px),transparent);
}
.lane-item{
  display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;
  padding:8px 9px;border-radius:var(--r-sm);border:1px solid transparent;
  transition:background .1s,border-color .1s;
}
.lane-item:hover{background:var(--surface2);border-color:var(--border)}
/* Partner-wait items inside Overdue / Due Today are dimmed: they're real, but
   not on Joel's desk — the un-dimmed rows are the "act now" scan. */
.lane-item.is-waiting{opacity:.6}
.lane-item.is-waiting:hover,.lane-item.is-waiting:focus-visible{opacity:1}
.lane-item .li-plan{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* Quick check-off: a hover/focus "done" control on task lane items so one
   click completes without leaving the deck. Sibling of the item button —
   never nested inside it. */
.li-wrap{position:relative}
/* The ✓ stays faintly visible at rest (so first-timers and touch users can
   find it) and ramps to full strength on hover / keyboard focus. The item
   button reserves right padding so the circle never sits on top of text. */
.li-wrap .lane-item{padding-right:36px}
.li-wrap .li-done{
  position:absolute;top:7px;right:7px;display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ok-line);
  background:var(--ok-soft);color:var(--ok);font-size:12px;font-weight:800;z-index:2;
  opacity:.35;transition:opacity .12s;
}
.li-wrap:hover .li-done,.li-wrap:focus-within .li-done{opacity:1}
.li-wrap .li-done:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
@media (pointer:coarse){.li-wrap .li-done{opacity:.65}}
.lane-item .li-label{font-size:12.5px;font-weight:500;line-height:1.3}
.lane-item .li-meta{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.lane-item .li-meta .neg{color:var(--danger);font-weight:700}
.lane-empty{padding:16px 12px;font-size:12px;color:var(--faint);text-align:center}
/* Day sub-headers turn the This Week scroll from a wall into a schedule. */
.lane-day{
  font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);padding:7px 9px 1px;border-top:1px solid var(--border);margin-top:3px;
}
.lane-day:first-child{border-top:none;margin-top:0;padding-top:3px}
/* Items already surfaced in an urgency lane collapse to one-line references
   in Waiting on Partners, so the deck doesn't repeat half of itself.
   The task label gets a guaranteed minimum (8ch) and the plan name is the
   part that ellipsizes first — a reference row with no task scent is useless. */
.lane-item.li-compact{flex-direction:row;align-items:baseline;gap:8px;padding:4px 9px;opacity:.72}
.li-wrap .lane-item.li-compact{padding-right:9px}
.lane-item.li-compact:hover,.lane-item.li-compact:focus-visible{opacity:1}
.lane-item.li-compact .li-plan{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0;max-width:40%}
.lane-item.li-compact .li-label{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:8ch}
.lane-item.li-compact .li-meta{margin-left:auto;flex:none}

/* ---------- portfolio grid ---------- */
.plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.plan-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--sh1);padding:15px 16px 14px;text-align:left;width:100%;
  display:flex;flex-direction:column;gap:10px;
  transition:box-shadow .15s,transform .12s,border-color .12s;
}
.plan-card:hover{box-shadow:var(--sh2);transform:translateY(-1px);border-color:var(--border-strong)}
.pc-top{display:flex;align-items:flex-start;gap:10px}
.pc-name{font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.pc-case{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em;margin-top:2px}
.pc-badges{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.pc-chips{display:flex;gap:5px;flex-wrap:wrap}
.pc-progress{display:flex;align-items:center;gap:9px}
.progress-track{flex:1;height:6px;border-radius:99px;background:var(--surface3);overflow:hidden}
.progress-fill{height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.pc-progress .mono{font-size:10.5px;color:var(--muted);white-space:nowrap}
.pc-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pc-phase{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;margin-right:auto}
.pc-warnings{display:flex;gap:5px;flex-wrap:wrap}

/* ---------- filter chips row ---------- */
.filter-row{display:flex;align-items:center;gap:6px}
.filter-chip{
  font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:5px 12px;border-radius:99px;border:1px solid var(--border);color:var(--muted);background:var(--surface);
}
.filter-chip:hover{border-color:var(--border-strong)}
.filter-chip.active{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-strong)}

/* ---------- empty state ---------- */
.empty-state{
  border:1.5px dashed var(--border-strong);border-radius:var(--r-lg);
  padding:52px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;
  background:var(--surface2);
}
.empty-state h3{font-size:16px;font-weight:700}
.empty-state p{color:var(--muted);font-size:13px;max-width:420px}
.empty-actions{display:flex;gap:10px;margin-top:6px}

/* ---------- plan detail ---------- */
.detail-topline{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);padding:5px 10px;border-radius:var(--r-sm)}
.back-link:hover{background:var(--surface3);color:var(--text)}
.detail-head{padding:18px 20px;margin-bottom:16px}
.dh-title-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.dh-title-row h2{font-size:21px;font-weight:800;letter-spacing:-.02em}
.dh-sub{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.status-select{
  appearance:none;-webkit-appearance:none;
  font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
  border-radius:99px;padding:4px 24px 4px 11px;border:1px solid var(--border-strong);
  background:var(--surface2);color:var(--text);cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='6' viewBox='0 0 8 6'><path d='M1 1l3 3 3-3' stroke='%238b96a7' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 9px center;
}
/* Green is reserved for "done" everywhere in this app (status dots, quick-done,
   ok pills) — so Complete takes the ok quartet and Active takes accent blue. */
.status-select.st-active{color:var(--accent-strong);background-color:var(--accent-soft);border-color:var(--accent-line)}
.status-select.st-pre_start{color:var(--wait);background-color:var(--wait-soft);border-color:var(--wait-line)}
.status-select.st-on_hold{color:var(--danger);background-color:var(--danger-soft);border-color:var(--danger-line)}
.status-select.st-complete{color:var(--ok);background-color:var(--ok-soft);border-color:var(--ok-line)}
.date-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.date-tile{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-md);padding:9px 12px;display:flex;flex-direction:column;gap:3px}
.date-tile .dt-date{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.02em}
.date-tile .dt-count{margin-top:1px;align-self:flex-start}
.contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px 16px;margin-bottom:8px}
.contact-cell{display:flex;flex-direction:column;gap:1px;min-width:0}
.contact-cell .cv{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-cell .cs{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-cell .missing{color:var(--danger);font-weight:600;font-size:12px}
.warn-strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.detail-cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.side-panel{display:flex;flex-direction:column;gap:14px;position:sticky;top:0}
.side-card{padding:14px 15px}
.side-card h3{font-size:12.5px;font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.notes-area{
  width:100%;min-height:110px;resize:vertical;border:1px solid var(--border);
  border-radius:var(--r-md);background:var(--surface2);padding:9px 11px;font-size:12.5px;line-height:1.5;
}
.notes-area:focus{border-color:var(--accent-line);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.history-list{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto}
.history-item{display:flex;flex-direction:column;gap:1px;border-left:2px solid var(--accent-line);padding-left:9px}
.history-item .hv{font-size:12px;font-weight:600}
.history-item .ht{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.04em}
.char-chips{display:flex;flex-wrap:wrap;gap:5px}

/* intake edit form */
.intake-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px 14px;margin-top:6px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.span2{grid-column:span 2}
.field label{font-family:var(--mono);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field input,.field select{
  border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);
  padding:7px 9px;font-size:13px;width:100%;
}
/* Match the custom control language: same chevron as .status-select on form
   selects, and quieter native date-picker icons. */
.field select{
  appearance:none;-webkit-appearance:none;padding-right:28px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7' viewBox='0 0 10 7'><path d='M1.5 1.5l3.5 3.5 3.5-3.5' stroke='%238b96a7' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;
}
.field input[type="date"]::-webkit-calendar-picker-indicator{opacity:.55;cursor:pointer}
.field input[type="date"]::-webkit-calendar-picker-indicator:hover{opacity:.9}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field .err{font-size:11px;color:var(--danger);display:none}
.field.invalid input{border-color:var(--danger)}
.field.invalid .err{display:block}
.check-row{display:flex;flex-wrap:wrap;gap:7px 16px;padding:4px 0}
.check-row label{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;cursor:pointer}
/* Custom-drawn checkboxes so both themes match the app's control language —
   native accent-color boxes render as flat gray squares in dark theme. */
.check-row input{
  appearance:none;-webkit-appearance:none;width:16px;height:16px;flex:none;
  border:1px solid var(--border-strong);border-radius:var(--r-xs);background:var(--surface);
  display:inline-grid;place-content:center;cursor:pointer;margin:0;
  transition:background .12s,border-color .12s;
}
.check-row input:hover{border-color:var(--accent)}
.check-row input:checked{background:var(--accent);border-color:var(--accent)}
.check-row input:checked::after{
  content:'';width:9px;height:5px;margin-top:-1px;
  border:2px solid var(--accent-contrast);border-top:none;border-right:none;
  transform:rotate(-45deg);
}
.form-sep{grid-column:1/-1;border:none;border-top:1px solid var(--border);margin:2px 0}
.form-sep-label{grid-column:1/-1;margin-top:4px}

/* ---------- phases & tasks ---------- */
.phase-block{margin-bottom:12px;overflow:hidden}
.phase-head{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:11px 14px;background:var(--surface2);border-bottom:1px solid transparent;
}
.phase-block.open .phase-head{border-bottom-color:var(--border)}
.phase-head:hover{background:var(--surface3)}
.phase-swatch{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.phase-name{font-weight:700;font-size:13.5px}
.phase-sub{font-size:11.5px;color:var(--muted)}
.phase-meta{margin-left:auto;display:flex;align-items:center;gap:10px}
.phase-progress{width:90px}
.phase-count{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.phase-caret{transition:transform .18s;color:var(--faint);flex:0 0 auto}
.phase-block.open .phase-caret{transform:rotate(90deg)}
.phase-tasks{display:none;flex-direction:column}
.phase-block.open .phase-tasks{display:flex}

.task-row{
  display:flex;align-items:flex-start;gap:11px;padding:9px 14px;
  border-bottom:1px solid var(--border);position:relative;
}
.task-row:last-child{border-bottom:none}
.task-row.overdue{box-shadow:inset 3px 0 0 var(--danger);background:color-mix(in srgb,var(--danger-soft) 34%,transparent)}
.task-row.st-done .task-label{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.task-row.st-na{opacity:.55}
.task-row.st-na .task-label{text-decoration:line-through;text-decoration-color:var(--faint)}
.task-row.flash{animation:rowflash 1.8s ease-out}
@keyframes rowflash{0%,50%{background:var(--accent-soft)}100%{background:transparent}}

.status-btn{
  flex:0 0 22px;width:22px;height:22px;border-radius:50%;margin-top:1px;
  border:2px solid var(--border-strong);background:var(--surface);position:relative;
  transition:border-color .12s,background .12s;
}
.status-btn:hover{border-color:var(--faint)}
.status-btn.s-working{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.status-btn.s-waiting{border-color:var(--wait);background:var(--wait-soft)}
.status-btn.s-waiting::after{content:"⏸";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--wait)}
.status-btn.s-done{border-color:var(--ok);background:var(--ok)}
.status-btn.s-done::after{content:"";position:absolute;left:5px;top:3px;width:6px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.status-btn.s-na{border-color:var(--border);background:var(--surface3)}
.status-btn.s-na::after{content:"";position:absolute;left:4px;top:8px;width:10px;height:2px;background:var(--faint);border-radius:2px}

.task-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.task-label{font-size:13px;font-weight:500;line-height:1.35}
.task-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.task-sla{font-family:var(--mono);font-size:10px;color:var(--wait);letter-spacing:.03em}
.tag{
  font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  border-radius:var(--r-xs);padding:1.5px 6px;
}
.tag-critical{color:var(--danger);background:var(--danger-soft)}
.tag-external{color:var(--violet);background:var(--violet-soft)}
.tag-payroll{color:var(--accent-strong);background:var(--accent-soft)}
.tag-asset{color:var(--warn);background:var(--warn-soft)}
.task-note-view{font-size:11.5px;color:var(--muted);background:var(--surface2);border-left:2px solid var(--border-strong);padding:4px 9px;border-radius:0 6px 6px 0;margin-top:2px;white-space:pre-wrap}
/* The rendered note is itself the edit affordance — clicking it opens the editor. */
button.task-note-view{display:block;width:100%;text-align:left;cursor:pointer;font-family:var(--sans)}
button.task-note-view:hover{border-left-color:var(--accent);color:var(--text)}
.task-note-edit{display:none;margin-top:4px}
.task-row.note-open .task-note-edit{display:block}
.task-row.note-open .task-note-view{display:none}
.task-note-edit input{
  width:100%;border:1px solid var(--accent-line);border-radius:var(--r-sm);
  background:var(--surface);padding:6px 9px;font-size:12px;
}
.task-side{display:flex;align-items:center;gap:6px;flex:0 0 auto;margin-top:1px}
.due-wrap{position:relative;display:inline-flex;align-items:center}
.due-input{
  font-family:var(--mono);font-size:11px;border:1px solid var(--border);
  border-radius:var(--r-sm);background:var(--surface2);color:var(--muted);
  padding:3.5px 5px;width:118px;
}
.due-input:hover{border-color:var(--border-strong)}
.due-input:focus{border-color:var(--accent);outline:none}
.due-input.due-overdue{color:var(--danger);border-color:var(--danger-line);background:var(--danger-soft);font-weight:700}
.due-input.due-overridden{border-style:dashed;border-color:var(--accent-line);color:var(--accent-strong)}
.due-days{font-family:var(--mono);font-size:10px;color:var(--muted);min-width:34px;text-align:right}
.due-days.neg{color:var(--danger);font-weight:700}
.mini-btn{
  font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--faint);border:1px solid var(--border);border-radius:var(--r-xs);padding:3px 6px;background:var(--surface);
}
.mini-btn:hover{color:var(--muted);border-color:var(--border-strong);background:var(--surface2)}
.mini-btn.on{color:var(--accent-strong);border-color:var(--accent-line);background:var(--accent-soft)}
/* One-click done on Plan Detail rows — faint at rest so the row stays calm
   but the affordance is discoverable (and reachable on touch, where hover
   never fires); full strength on hover / keyboard focus. */
.task-quick-done{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft);opacity:.35;transition:opacity .12s}
.task-row:hover .task-quick-done,.task-row:focus-within .task-quick-done{opacity:1}
.task-quick-done:hover{color:#fff;background:var(--ok);border-color:var(--ok)}
@media (pointer:coarse){.task-quick-done{opacity:.65}}

/* ---------- timeline ---------- */
.tl-wrap{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh1);overflow:hidden}
.tl-scroll{overflow-x:auto;position:relative}
.tl-canvas{position:relative;min-width:100%}
.tl-months{display:flex;border-bottom:1px solid var(--border);background:var(--surface2);position:relative;height:34px}
.tl-month{
  flex:0 0 auto;display:flex;align-items:center;padding-left:9px;
  font-family:var(--mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);
  border-right:1px solid var(--border);
}
/* When the canvas stretches past the last month (min-width:100% on wide
   viewports), let the final column flex-fill instead of leaving a bare stub. */
.tl-month:last-of-type{flex:1 0 auto;border-right:none}
.tl-row{display:flex;border-bottom:1px solid var(--border);position:relative;min-height:64px}
.tl-row:last-child{border-bottom:none}
.tl-label{
  position:sticky;left:0;z-index:5;flex:0 0 190px;width:190px;
  background:var(--surface);border-right:1px solid var(--border);
  padding:9px 12px;display:flex;flex-direction:column;gap:2px;justify-content:center;
}
.tl-label .tn{font-size:12.5px;font-weight:700;line-height:1.2}
.tl-label .tc{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.04em}
.tl-track{position:relative;flex:1}
.tl-seg{
  position:absolute;height:10px;border-radius:5px;opacity:.9;min-width:6px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);overflow:hidden;
}
.tl-seg:hover,.tl-seg:focus-visible{opacity:1;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px currentColor}
.tl-seg:focus-visible{outline:none}
/* Inline phase name on Wide-zoom segments — identity without hover or legend. */
.tl-seg .seg-lbl{
  display:block;padding:0 5px;font-family:var(--mono);font-size:8px;font-weight:700;
  line-height:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--surface);
  white-space:nowrap;overflow:hidden;text-overflow:clip;
}
.tl-marker{position:absolute;top:6px;bottom:6px;width:0;z-index:2}
.tl-marker .mk{
  position:absolute;top:0;left:-5px;width:10px;height:10px;transform:rotate(45deg);
  border-radius:2px;box-shadow:0 0 0 2px var(--surface);
}
/* Milestone labels sit in the gutter below the phase lanes, in track
   coordinates (left/top inline), anchored to their cluster's first diamond. */
.mk-label{
  position:absolute;font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:.06em;white-space:nowrap;line-height:1;z-index:2;
}
.mk-label .mk-sep{color:var(--faint);margin:0 2px}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);opacity:.65;z-index:3}
.tl-today-flag{
  position:absolute;top:2px;left:4px;font-family:var(--mono);font-size:10px;font-weight:700;
  color:var(--danger);letter-spacing:.08em;white-space:nowrap;
}
.tl-gridline{position:absolute;top:0;bottom:0;width:1px;background:var(--border);opacity:.55}
.tl-legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--border);background:var(--surface2)}
.tl-legend .lg{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tl-legend .sw{width:14px;height:8px;border-radius:var(--r-xs)}
.tl-legend .dm{width:8px;height:8px;transform:rotate(45deg);border-radius:2px}

/* ---------- calendar ---------- */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.cal-card{overflow:hidden}
.cal-toolbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--surface2)}
.cal-toolbar h3{font-size:15px;font-weight:700;min-width:150px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-dow{
  font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
  color:var(--faint);text-align:center;padding:8px 0;border-bottom:1px solid var(--border);
}
.cal-day{
  min-height:86px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);
  padding:6px 7px;display:flex;flex-direction:column;gap:4px;text-align:left;align-items:stretch;
  background:var(--surface);transition:background .1s;position:relative;
}
.cal-day:nth-child(7n){border-right:none}
.cal-day:hover{background:var(--surface2)}
/* Weekend columns are shaded — calendar-day offsets routinely land tasks on
   Sat/Sun, and the shading makes that visible at a glance. Weekends use the
   stronger surface3 tint; adjacent-month cells stay on surface2 with a faint
   day number, so the two states never read the same. */
.cal-day.wknd{background:var(--surface3)}
.cal-day.other{background:var(--surface2)}
.cal-day.other .cal-num{color:var(--faint)}
.cal-day.selected{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent-line)}
.cal-num{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted)}
.cal-day.today .cal-num{
  display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  background:var(--accent);color:var(--accent-contrast);border-radius:50%;
}
.cal-dots{display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start}
.cal-dot{width:7px;height:7px;border-radius:50%}
.cal-more{font-family:var(--mono);font-size:10px;color:var(--muted)}
.cal-detail-list{display:flex;flex-direction:column;gap:5px;padding:8px}
.cal-detail-head{padding:12px 15px;border-bottom:1px solid var(--border);background:var(--surface2)}
.cal-legend{display:flex;gap:12px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--border);background:var(--surface2)}
.cal-legend .lg{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

/* ---------- reference ---------- */
.ref-search{position:relative;max-width:430px;margin-bottom:18px}
.ref-search input{
  width:100%;border:1px solid var(--border-strong);border-radius:var(--r-md);
  background:var(--surface);padding:9px 13px 9px 36px;font-size:13.5px;box-shadow:var(--sh1);
}
.ref-search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.ref-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint);pointer-events:none}
.rules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:11px}
/* Cap at 3 columns so the 9 Rules always land as a clean 3×3, never 4/4/1. */
@media (min-width:1200px){.rules-grid{grid-template-columns:repeat(3,1fr)}}
.rule-card{padding:13px 15px;display:flex;gap:12px;align-items:flex-start}
.rule-num{
  flex:0 0 28px;width:28px;height:28px;border-radius:var(--r-md);background:var(--accent-soft);color:var(--accent-strong);
  border:1px solid var(--accent-line);display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:800;font-size:13px;
}
.rule-card .rt{font-weight:700;font-size:13px;margin-bottom:2px}
.rule-card .rb{font-size:12px;color:var(--muted);line-height:1.45}
.cutoff-list{display:flex;flex-direction:column}
.cutoff-item{display:flex;gap:14px;padding:11px 16px;border-bottom:1px solid var(--border);align-items:baseline}
.cutoff-item:last-child{border-bottom:none}
.cutoff-time{flex:0 0 148px;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--warn)}
.cutoff-desc{font-size:12.5px;color:var(--text)}
.cutoff-desc .sub{color:var(--muted);font-size:11.5px}
.people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:11px}
.person-card{padding:12px 14px}
.person-card .pn{font-weight:700;font-size:13px}
.person-card .pr{font-family:var(--mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-strong);margin-bottom:4px}
.person-card .pd{font-size:12px;color:var(--muted);line-height:1.45}
.person-card .pe{font-family:var(--mono);font-size:10.5px;color:var(--violet);margin-top:4px;word-break:break-all}
.gloss-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:9px}
.gloss-card{padding:10px 13px}
.gloss-card .gt{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.gloss-card .ga{font-family:var(--mono);font-weight:800;font-size:12.5px;letter-spacing:.03em;color:var(--accent-strong)}
.gloss-card .gf{font-size:11px;color:var(--faint);font-style:italic}
.gloss-card .gd{font-size:12px;color:var(--muted);line-height:1.45}
.vendor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:9px}
.vendor-card{padding:10px 13px;display:flex;flex-direction:column;gap:3px}
.vendor-card .vn{font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:7px}
.vendor-card .vg{font-size:11.5px;color:var(--muted);line-height:1.4}
.ref-note{font-size:11.5px;color:var(--faint);margin-top:8px}
.ref-miss{display:none;padding:26px;text-align:center;color:var(--faint);font-size:13px}
.hidden{display:none !important}

/* ---------- modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;padding:5vh 18px;z-index:100;
  overflow-y:auto;
}
.modal{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--sh3);width:100%;max-width:680px;overflow:hidden;
  animation:modalin .18s ease-out;
}
.modal.modal-sm{max-width:460px}
@keyframes modalin{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);background:var(--surface2)}
.modal-head h2{font-size:16px;font-weight:800;letter-spacing:-.01em}
.modal-head .icon-btn{margin-left:auto}
.modal-body{padding:18px 20px;max-height:70vh;overflow-y:auto}
.modal-foot{display:flex;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid var(--border);background:var(--surface2)}
.modal-foot .right{margin-left:auto;display:flex;gap:10px}
.settings-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.settings-row .sr-text{flex:1}
.settings-row .sr-text strong{display:block;font-size:13px}
.settings-row .sr-text span{font-size:11.5px;color:var(--muted)}
/* Styled stand-in for window.confirm (lives in #confirmRoot, above #modalRoot) */
.confirm-body{font-size:13.5px;color:var(--muted);line-height:1.5}
.confirm-body p{margin:0 0 6px}
.confirm-body p:last-child{margin-bottom:0}
.confirm-body ul{margin:4px 0 8px 18px;padding:0}
.confirm-body li{margin:3px 0}
.confirm-body strong{color:var(--text)}

/* ---------- toasts ---------- */
.toast-root{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:9px;z-index:200}
.toast{
  background:var(--rail-bg);color:var(--rail-text);border-radius:var(--r-md);
  padding:10px 16px;font-size:12.5px;font-weight:500;box-shadow:var(--sh3);
  display:flex;align-items:center;gap:9px;max-width:340px;
  animation:toastin .22s ease-out;border-left:3px solid var(--accent);
}
.toast.t-ok{border-left-color:#42c078}.toast.t-warn{border-left-color:#e5a44e}.toast.t-danger{border-left-color:#f07a6f}
.toast-act{
  margin-left:auto;flex:0 0 auto;font-family:var(--mono);font-size:10.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;color:#fff;cursor:pointer;
  border:1px solid rgba(255,255,255,.4);border-radius:var(--r-xs);padding:3px 9px;background:rgba(255,255,255,.08);
}
.toast-act:hover{background:rgba(255,255,255,.18)}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast.out{opacity:0;transform:translateY(6px);transition:all .25s}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .rail{width:var(--rail-w-collapsed)}
  .rail .brand-text,.rail .rail-btn span,.rail .rail-count{display:none}
  .rail .rail-btn{justify-content:center;padding:9px 0}
  .rail .rail-section{visibility:hidden;height:10px;margin:8px 0 2px}
  .detail-cols{grid-template-columns:1fr}
  .side-panel{position:static}
  .cal-wrap{grid-template-columns:1fr}
  .view-root{padding:16px 14px 60px}
  .topbar{padding:12px 14px}
}
@media (max-width:640px){
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .plan-grid{grid-template-columns:1fr}
  .lanes{grid-template-columns:1fr}
  .tl-label{flex-basis:130px;width:130px}
}
</style>
</head>
<body>
<div id="app" class="app">
  <aside id="rail" class="rail" aria-label="Primary navigation">
    <div class="rail-brand">
      <div class="brand-mark" aria-hidden="true">DC</div>
      <div class="brand-text">
        <span class="eyebrow">Transamerica</span>
        <strong>LMDC Command Center</strong>
      </div>
    </div>
    <nav class="rail-nav" id="railNav">
      <span class="rail-section eyebrow">Console</span>
      <button class="rail-btn" data-action="nav" data-view="deck" aria-label="Command Deck">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7.5" height="9" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="5.5" rx="1.5"/><rect x="13.5" y="12" width="7.5" height="9" rx="1.5"/><rect x="3" y="15.5" width="7.5" height="5.5" rx="1.5"/></svg>
        <span>Command Deck</span><span class="rail-count" id="railCountDeck" hidden></span>
      </button>
      <button class="rail-btn" data-action="nav" data-view="plan" aria-label="Plan Detail">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h10M9 12h10M9 19h10"/><rect x="3.5" y="3.5" width="3" height="3" rx="1"/><rect x="3.5" y="10.5" width="3" height="3" rx="1"/><rect x="3.5" y="17.5" width="3" height="3" rx="1"/></svg>
        <span>Plan Detail<span class="rail-sub" id="railPlanSub" hidden></span></span>
      </button>
      <button class="rail-btn" data-action="nav" data-view="timeline" aria-label="Timeline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h9M3 12h14M3 18h6"/><circle cx="16" cy="6" r="2"/><circle cx="21" cy="12" r="0.5"/><circle cx="13" cy="18" r="2"/></svg>
        <span>Timeline</span>
      </button>
      <button class="rail-btn" data-action="nav" data-view="calendar" aria-label="Calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 10h17M8 2.5V7M16 2.5V7"/></svg>
        <span>Calendar</span>
      </button>
      <span class="rail-section eyebrow">Pocket Brain</span>
      <button class="rail-btn" data-action="nav" data-view="reference" aria-label="Reference">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2Zm0 0a2 2 0 0 0 2 2h13"/><path d="M9 7h6"/></svg>
        <span>Reference</span>
      </button>
    </nav>
    <div class="rail-foot">
      <button class="rail-btn" data-action="toggle-rail" aria-label="Collapse or expand navigation rail" id="railToggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 7l-5 5 5 5M18 7l-5 5 5 5"/></svg>
        <span>Collapse</span>
      </button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <span class="eyebrow">Large Market Data Consultant &middot; Transamerica</span>
        <h1 id="topbarTitle">Command Deck</h1>
      </div>
      <div class="topbar-actions">
        <span class="today-chip" id="todayChip"></span>
        <button class="btn btn-primary" data-action="open-new-plan">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          New Plan
        </button>
        <button class="icon-btn" data-action="toggle-theme" aria-label="Toggle light or dark theme" id="themeBtn">
          <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z"/></svg>
          <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><circle cx="12" cy="12" r="4.4"/><path d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>
        </button>
        <button class="icon-btn" data-action="open-settings" aria-label="Settings, import and export">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.64 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></svg>
        </button>
      </div>
    </header>
    <div id="viewRoot" class="view-root"></div>
  </main>
</div>
<div id="modalRoot"></div>
<div id="confirmRoot"></div>
<div id="toastRoot" class="toast-root" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
'use strict';
/* ================================================================
   LMDC COMMAND CENTER
   Single-file console for a Transamerica Large Market Data
   Consultant. Vanilla JS. localStorage persistence.
   ================================================================ */

/* ---------------- constants & keys ---------------- */
const LS_DB     = 'lmdcCommandCenter:v1:db';
const LS_THEME  = 'lmdcCommandCenter:v1:theme';
const LS_RAIL   = 'lmdcCommandCenter:v1:rail';
const LS_SEEDED = 'lmdcCommandCenter:v1:seeded';
const LS_VIEW   = 'lmdcCommandCenter:v1:view';
const APP_NAME  = 'LMDC Command Center';

const PLAN_STATUS = {
  pre_start:{label:'Pre-Start'}, active:{label:'Active'},
  on_hold:{label:'On Hold'}, complete:{label:'Complete'}
};
const STATUS_ORDER = ['open','working','waiting','done'];
const STATUS_LABEL = {open:'Open', working:'Working', waiting:'Waiting', done:'Done', na:'N/A'};

/* Phase colors live in CSS as --ph-* custom properties (light + brightened
   dark variants); JS references the vars so every phase-colored surface is
   theme-aware. */
const PHASES = [
  {id:'pre_start',   label:'Pre-Start',   sub:'Before the documents arrive',        color:'var(--ph-pre_start)'},
  {id:'setup',       label:'Setup',       sub:'Documents, templates, connections',  color:'var(--ph-setup)'},
  {id:'payroll',     label:'Payroll',     sub:'Files, validation, handoff',         color:'var(--ph-payroll)'},
  {id:'prk',         label:'PRK',         sub:'Prior record keeper coordination',   color:'var(--ph-prk)'},
  {id:'preparation', label:'Preparation', sub:'Mapping and pre-wire readiness',     color:'var(--ph-preparation)'},
  {id:'wire_day',    label:'Wire Day',    sub:'The money moves',                    color:'var(--ph-wire_day)'},
  {id:'post_wire',   label:'Post Wire',   sub:'Final files and balances',           color:'var(--ph-post_wire)'},
  {id:'data_load',   label:'Data Load',   sub:'Participant data into TA',           color:'var(--ph-data_load)'},
  {id:'closeout',    label:'Closeout',    sub:'Go-live and wrap-up',                color:'var(--ph-closeout)'}
];
const PHASE_BY_ID = Object.fromEntries(PHASES.map(p=>[p.id,p]));

/* ---------------- gating helpers ---------------- */
const G = {
  nonStartup: p => p.intake.planType !== 'startup',
  tik:        p => (p.intake.strategies||[]).includes('tik'),
  cash:       p => (p.intake.strategies||[]).includes('cash'),
  mappingOrTik: p => { const s=p.intake.strategies||[]; return s.includes('mapping')||s.includes('tik'); },
  notTikOnly: p => { const s=p.intake.strategies||[]; return !(s.length===1 && s[0]==='tik'); },
  loans:      p => !!p.characteristics.loans,
  roth:       p => !!p.characteristics.roth,
  ytdApplies: p => {
    if (p.intake.planType==='startup') return false;
    if (p.characteristics.isOneOnePlan) return false;
    const e = p.intake.effectiveDate;
    if (e && /^\d{4}-01-01$/.test(e)) return false;   // Jan-1 EFF drops YTD
    return true;
  },
  histApplies: p => p.intake.planType !== 'startup'
};

/* ----------------------------------------------------------------
   TASK CATALOG — anchors: day1 | effective_date | wire_date |
   first_payroll_ta_date | final_files (WIRE+7) | manual
   Offsets are calendar days (labeled in UI + Reference).
   ---------------------------------------------------------------- */
const TASKS = [
  /* -------- pre_start -------- */
  {id:'pre-kickoff-context', phase:'pre_start', label:'Review NBI assignment & gather kickoff context',
   anchor:'day1', offset:0, tags:[]},
  {id:'pre-check-vendor-workflow', phase:'pre_start', label:'Check payroll vendor workflow & known gotchas',
   anchor:'day1', offset:1, tags:['payroll']},

  /* -------- setup -------- */
  {id:'setup-all-docs', phase:'setup', label:'Receive & review all plan documents (PRD / OB / TOA)',
   anchor:'day1', offset:2, tags:['critical'], noNA:true,
   hint:'Completing this promotes the plan from Pre-Start to Active.'},
  {id:'setup-base-template', phase:'setup', label:'Build Base Data template',
   anchor:'day1', offset:7, tags:[]},
  {id:'setup-payroll-template', phase:'setup', label:'Build payroll template',
   anchor:'day1', offset:7, tags:['payroll']},
  {id:'setup-collect-base-data', phase:'setup', label:'Collect completed Base Data from client',
   anchor:'day1', offset:23, sla:'Client SLA: 14 days', tags:['external']},
  {id:'setup-re-registration', phase:'setup', label:'Prepare re-registration form (TIK funds)',
   anchor:'day1', offset:6, gate:G.tik, tags:['critical','asset']},
  {id:'setup-ftp-connection', phase:'setup', label:'Identify FTP contact & open FTP setup request',
   anchor:'day1', offset:2, sla:'FTP team: 10 days', tags:['external'],
   hint:'Rule 1 — start FTP as early as humanly possible.'},
  {id:'setup-eds-layouts', phase:'setup', label:'Set up EDS layouts',
   anchor:'day1', offset:9, tags:[]},
  {id:'setup-informatica-prep', phase:'setup', label:'Prep Informatica jobs & workflow queries',
   anchor:'day1', offset:10, gate:G.nonStartup, tags:[]},
  {id:'setup-wire-instructions-prk', phase:'setup', label:'Prepare wire instructions packet for Prior RK',
   anchor:'day1', offset:0, gate:G.nonStartup, tags:['critical','external'],
   hint:'Rule 1 — contact the prior record keeper ASAP.'},

  /* -------- payroll -------- */
  {id:'payroll-complete-template', phase:'payroll', label:'Complete payroll template & send to client / vendor',
   anchor:'day1', offset:9, tags:['payroll']},
  {id:'payroll-ftp-setup', phase:'payroll', label:'FTP setup complete & file specs delivered',
   anchor:'day1', offset:12, sla:'FTP team: 10 days', tags:['payroll','external']},
  {id:'payroll-obf-confirm', phase:'payroll', label:'Confirm outbound file (OBF) needs — 360 feeds',
   anchor:'day1', offset:14, tags:['payroll']},
  {id:'payroll-receive-test-file', phase:'payroll', label:'Receive test payroll file',
   anchor:'day1', offset:29, sla:'Payroll vendor: 14 days', tags:['payroll','external']},
  {id:'payroll-validate-test-file', phase:'payroll', label:'Validate test file in EDS — read the output',
   anchor:'day1', offset:31, tags:['payroll','critical'],
   hint:'Rule 7 — read EDS output after every single upload.'},
  {id:'payroll-one-payroll', phase:'payroll', label:'Submit to One Payroll & obtain approval',
   anchor:'day1', offset:35, sla:'One Payroll: 14 days', tags:['payroll','external']},
  {id:'payroll-finalize', phase:'payroll', label:'Finalize payroll — ready for first live file',
   anchor:'first_payroll_ta_date', offset:-1, tags:['payroll','critical'], noNA:true,
   hint:'Clears the Payroll Watch warning. Confirm control totals with the client.'},

  /* -------- prk -------- */
  {id:'prk-wire-instructions', phase:'prk', label:'Send wire instructions & confirm receipt with Prior RK',
   anchor:'day1', offset:0, gate:G.nonStartup, tags:['critical','external'], sla:'Rule 1: ASAP'},
  {id:'prk-all-details-dates', phase:'prk', label:'Confirm transfer details & dates with Prior RK',
   anchor:'day1', offset:4, gate:G.nonStartup, sla:'Prior RK: 3 days', tags:['external']},
  {id:'prk-test-files', phase:'prk', label:'Request & receive test files from Prior RK',
   anchor:'day1', offset:8, gate:G.nonStartup, sla:'Prior RK: 3 days', tags:['external','critical'],
   hint:'Rule 3 — start source mapping the moment these land.'},
  {id:'prk-tik-account-details', phase:'prk', label:'TIK account setup complete & details confirmed',
   anchor:'day1', offset:22, gate:p=>G.nonStartup(p)&&G.tik(p), sla:'TIK setup: ~14 days from TOA',
   tags:['asset','critical','external']},

  /* -------- preparation -------- */
  {id:'prep-source-mapping', phase:'preparation', label:'Complete source mapping & send to QA / TC / TM',
   anchor:'day1', offset:12, gate:G.nonStartup, tags:['critical'],
   hint:'Rule 3 — source mapping starts as soon as test files arrive. Only map sources with balances.'},
  {id:'prep-fund-mapping', phase:'preparation', label:'Complete fund mapping & send for approval',
   anchor:'day1', offset:8, gate:p=>G.nonStartup(p)&&G.mappingOrTik(p), tags:['critical','asset'],
   hint:'Rule 2 — fund mapping starts the moment the TOA is signed.'},
  {id:'prep-informatica', phase:'preparation', label:'Informatica balance prep verified',
   anchor:'effective_date', offset:-7, gate:G.nonStartup, tags:[]},
  {id:'prep-fmc', phase:'preparation', label:'FMC estimates confirmed',
   anchor:'wire_date', offset:-8, gate:G.nonStartup, tags:['asset'],
   hint:'FMC estimates go in at least 5 business days (≈8 calendar days) before the TOA/transfer.'},
  {id:'prep-tik', phase:'preparation', label:'Send re-registration details to Matt O’Connell',
   anchor:'wire_date', offset:-17, gate:p=>G.nonStartup(p)&&G.tik(p), sla:'Target: 12 business days (≈17 calendar) pre-liquidation',
   tags:['asset','critical','external'],
   hint:'Rule 4 — Matt O’Connell needs re-reg details 12 business days before liquidation.'},
  {id:'prep-pre-wire-vendor', phase:'preparation', label:'Advance notice email — vendor',
   anchor:'wire_date', offset:-5, gate:G.nonStartup, sla:'SCHED: WIRE−5', tags:['external','critical'],
   hint:'Give the fund vendor five days of runway before the wire.'},
  {id:'prep-pre-wire-cashiering', phase:'preparation', label:'Advance notice email — Cashiering',
   anchor:'wire_date', offset:-3, gate:G.nonStartup, sla:'SCHED: WIRE−3', tags:['external','critical'],
   hint:'shtaopscashieringinc@transamerica.com — three days of runway so Cashiering watches for the wire. On wire day THEY confirm receipt (with the transfer ref number) by 3:45 PM CST; no confirmation by then means you chase it.'},

  /* -------- wire_day -------- */
  {id:'wire-morning-emails', phase:'wire_day', label:'Morning-of-wire notifications sent',
   anchor:'wire_date', offset:0, gate:G.nonStartup, tags:['critical']},
  {id:'wire-receive-wire', phase:'wire_day', label:'Receive wire & confirm amount',
   anchor:'wire_date', offset:0, gate:G.nonStartup, tags:['asset','critical'],
   hint:'Wires landing after 3PM CST deposit next business day.'},
  {id:'wire-move-process-wire', phase:'wire_day',
   labelFn:p=>{ const s=p.intake.strategies||[];
     if (s.includes('cash')&&s.includes('mapping')) return 'Move & process wire — liquidate + place trades';
     if (s.includes('mapping')) return 'Place mapping trades (Immediate + Batch)';
     return 'Process liquidation proceeds & move money'; },
   label:'Move & process wire',
   anchor:'wire_date', offset:0, gate:p=>G.nonStartup(p)&&G.notTikOnly(p), tags:['asset','critical'],
   hint:'Rule 9 — Immediate + Batch when placing trades; Online + No Hold when no trades. Rule 6 — this cannot be tested; triple-check the CONV file.'},

  /* -------- post_wire -------- */
  {id:'post-receive-final-files', phase:'post_wire', label:'Receive final files from Prior RK',
   anchor:'wire_date', offset:7, gate:G.nonStartup, sla:'Prior RK SLA: 1 week max', tags:['external','critical']},
  {id:'post-liquidate-ae', phase:'post_wire', label:'Liquidation / AE processing complete',
   anchor:'final_files', offset:2, gate:p=>G.nonStartup(p)&&G.cash(p), tags:['asset']},
  {id:'post-check-tik-shares', phase:'post_wire', label:'Verify TIK shares received in good order',
   anchor:'final_files', offset:3, gate:p=>G.nonStartup(p)&&G.tik(p), tags:['asset']},
  {id:'post-ppt-balances', phase:'post_wire', label:'Load participant balances',
   anchor:'final_files', offset:7, gate:G.nonStartup, tags:['asset','critical']},

  /* -------- data_load -------- */
  {id:'p5-extra-participants', phase:'data_load', label:'Load extra participants', anchor:'final_files', offset:7, tags:[]},
  {id:'p5-elections', phase:'data_load', label:'Load investment elections', anchor:'final_files', offset:7, tags:[]},
  {id:'p5-def', phase:'data_load', label:'Load deferral rates — BEFORE eligibility', anchor:'final_files', offset:7,
   tags:['critical'], hint:'Rule 5 — deferrals load before eligibility, always, no exceptions.'},
  {id:'p5-elig', phase:'data_load', label:'Load eligibility dates — after deferrals', anchor:'final_files', offset:8, tags:['critical']},
  {id:'p5-loans', phase:'data_load', label:'Load loans', anchor:'final_files', offset:7, gate:G.loans, tags:[]},
  {id:'p5-basis-roth', phase:'data_load', label:'Load Roth basis & start dates', anchor:'final_files', offset:7, gate:G.roth, tags:[]},
  {id:'p5-yos', phase:'data_load', label:'Load years of service', anchor:'final_files', offset:7, gate:G.histApplies, tags:[]},
  {id:'p5-ytd-comp', phase:'data_load', label:'Load YTD compensation', anchor:'final_files', offset:7, gate:G.ytdApplies, tags:[]},
  {id:'p5-ytd-contrib', phase:'data_load', label:'Load YTD contributions', anchor:'final_files', offset:7, gate:G.ytdApplies, tags:[]},
  {id:'p5-ytd-hours', phase:'data_load', label:'Load YTD hours', anchor:'final_files', offset:7, gate:G.ytdApplies, tags:[]},
  {id:'p5-ben', phase:'data_load', label:'Load beneficiaries (N/A if none provided)', anchor:'final_files', offset:10, tags:[]},
  {id:'p5-py-comp', phase:'data_load', label:'Load prior-year compensation', anchor:'final_files', offset:10, gate:G.histApplies, tags:[]},
  {id:'p5-py-hours', phase:'data_load', label:'Load prior-year hours', anchor:'final_files', offset:10, gate:G.histApplies, tags:[]},

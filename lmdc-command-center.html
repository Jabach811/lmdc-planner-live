<script>
'use strict';
/* ================================================================
   UTILITIES — date math is all local-time, string-safe.
   ================================================================ */
const $  = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escAttr(s){ return esc(s); }

/* 'YYYY-MM-DD' -> local Date (no UTC parsing pitfalls) */
function parseISO(s){
  if (!s || typeof s!=='string') return null;
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return null;
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  if (isNaN(d)) return null;
  // Reject impossible dates (e.g. 2026-13-05) instead of letting them roll over.
  if (d.getMonth() !== (+m[2]-1) || d.getDate() !== +m[3]) return null;
  return d;
}
function toISO(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function today(){ const n=new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function addDays(d, n){ const r=new Date(d.getFullYear(), d.getMonth(), d.getDate()); r.setDate(r.getDate()+n); return r; }
function daysBetween(a, b){ return Math.round((b - a) / 86400000); }  // b - a in days
function daysFromToday(d){ return daysBetween(today(), d); }

const MONTHS_S = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_L = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW_S = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function fmtShort(d){ return d ? MONTHS_S[d.getMonth()]+' '+d.getDate() : '—'; }
function fmtMed(d){ return d ? MONTHS_S[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear() : '—'; }
function fmtISO(s){ const d=parseISO(s); return d?fmtMed(d):'—'; }
function fmtStamp(iso){
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return MONTHS_S[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear()+' · '+
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function relDays(n){
  if (n===0) return 'today';
  if (n>0) return 'in '+n+'d';
  return Math.abs(n)+'d ago';
}
function uid(){ return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

/* ================================================================
   STORAGE
   ================================================================ */
let db = { plans: [], selectedPlanId: null };

let dbLoadCorrupt = false;
function loadDb(){
  let raw = null;
  try{ raw = localStorage.getItem(LS_DB); }catch(e){ return null; }
  if (!raw) return null;
  try{
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.plans)) throw new Error('bad shape');
    return parsed;
  }catch(e){
    // Never silently destroy data: keep up to 3 timestamped backups of
    // unreadable blobs (pruned oldest-first) and flag the condition for init
    // to surface. A second, different corruption arriving before the user
    // recovers must not clobber the first — either might be hand-recoverable.
    dbLoadCorrupt = true;
    try{
      const prefix = LS_DB+'.corrupt';
      const keys = [];
      let dup = false;
      for (let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if (k && k.indexOf(prefix)===0){
          keys.push(k);
          // Repeated reloads of the SAME corruption must not churn new copies.
          if (localStorage.getItem(k)===raw) dup = true;
        }
      }
      if (!dup){
        keys.sort();                      // epoch-suffixed keys sort chronologically
        while (keys.length>=3) localStorage.removeItem(keys.shift());
        localStorage.setItem(prefix+'.'+Date.now(), raw);
      }
    }catch(e2){}
    return null;
  }
}
let lastSaveFailToast = 0;
function saveDb(){
  try{ localStorage.setItem(LS_DB, JSON.stringify(db)); }
  catch(e){
    // Throttled like the cross-tab sync toast: under sustained quota
    // exhaustion rapid task-checking must not stack a wall of toasts.
    const now = Date.now();
    if (now - lastSaveFailToast > 8000){
      lastSaveFailToast = now;
      toast('Could not save — storage unavailable. Changes are held in memory only; export your data.', 'danger', {life:6000});
    }
  }
}
function normalizePlan(p){
  // Defensive normalization for imported / legacy / corrupt records.
  const now = new Date().toISOString();
  const src = (p && typeof p==='object') ? p : {};
  const intake = (src.intake && typeof src.intake==='object') ? src.intake : {};
  const contacts = (intake.contacts && typeof intake.contacts==='object') ? intake.contacts : {};
  // Every value that later feeds string methods (.localeCompare sorts, .trim,
  // .match) must leave here as an actual string — a numeric 20260801 from a
  // hand-edited blob or foreign export would otherwise crash every render.
  const str = v => typeof v==='string' ? v : '';
  const dateStr = v => (typeof v==='string' && parseISO(v)) ? v : '';
  const person = c => {
    if (!c) return {name:'', email:''};
    if (typeof c==='string') return {name:c, email:''};
    return {name:str(c.name), email:str(c.email)};
  };
  const vendorPerson = c => {
    if (!c) return {vendorName:'', name:'', email:''};
    if (typeof c==='string') return {vendorName:c, name:'', email:''};
    return {vendorName:str(c.vendorName), name:str(c.name), email:str(c.email)};
  };
  const chars = (src.characteristics && typeof src.characteristics==='object') ? src.characteristics : {};
  const tasks = {};
  if (src.tasks && typeof src.tasks==='object'){
    for (const [id, t] of Object.entries(src.tasks)){
      if (!t || typeof t!=='object') continue;
      const st = ['open','working','waiting','done','na'].includes(t.status) ? t.status : 'open';
      tasks[id] = {
        status: st,
        note: typeof t.note==='string' ? t.note : '',
        dueOverride: (typeof t.dueOverride==='string' && parseISO(t.dueOverride)) ? t.dueOverride : undefined,
        completedAt: t.completedAt || undefined,
        updatedAt: t.updatedAt || now
      };
      if (!tasks[id].dueOverride) delete tasks[id].dueOverride;
      if (!tasks[id].completedAt) delete tasks[id].completedAt;
    }
  }
  return {
    // Ids land in HTML attributes; only accept safe slug-shaped ids from imports.
    id: (typeof src.id==='string' && /^[A-Za-z0-9_-]+$/.test(src.id)) ? src.id : uid(),
    createdAt: src.createdAt || now,
    updatedAt: src.updatedAt || now,
    archivedAt: src.archivedAt || undefined,
    status: ['pre_start','active','on_hold','complete'].includes(src.status) ? src.status : 'pre_start',
    intake: {
      planName: str(intake.planName) || 'Untitled Plan',
      caseNumber: str(intake.caseNumber),
      planType: ['startup','conversion','merger'].includes(intake.planType) ? intake.planType : 'conversion',
      mergerType: ['internal','external'].includes(intake.mergerType) ? intake.mergerType : undefined,
      strategies: Array.isArray(intake.strategies) ? intake.strategies.filter(s=>['cash','mapping','tik'].includes(s)) : [],
      effectiveDate: dateStr(intake.effectiveDate),
      wireDate: dateStr(intake.wireDate),
      firstPayrollTaDate: dateStr(intake.firstPayrollTaDate),
      day1: dateStr(intake.day1),
      dcFileCoordinator: str(intake.dcFileCoordinator),
      clientFolderUrl: (typeof intake.clientFolderUrl==='string' && !/^\s*(javascript|data|vbscript):/i.test(intake.clientFolderUrl)) ? intake.clientFolderUrl : '',
      contacts: {
        client: person(contacts.client),
        tm: (typeof contacts.tm==='object'&&contacts.tm) ? str(contacts.tm.name) : str(contacts.tm),
        tc: (typeof contacts.tc==='object'&&contacts.tc) ? str(contacts.tc.name) : str(contacts.tc),
        payroll: vendorPerson(contacts.payroll),
        priorRecordKeeper: vendorPerson(contacts.priorRecordKeeper)
      }
    },
    characteristics: {
      isOneOnePlan: !!chars.isOneOnePlan, nonQual: !!chars.nonQual,
      autoEnroll: !!chars.autoEnroll, loans: !!chars.loans, roth: !!chars.roth
    },
    tasks,
    notes: typeof src.notes==='string' ? src.notes : '',
    dateHistory: Array.isArray(src.dateHistory) ? src.dateHistory.filter(h=>h&&h.field) : [],
    // Demo-only seed cases carry a visible flag so they can't be mistaken
    // for real assigned work (undefined keys drop out of JSON.stringify).
    demo: src.demo ? true : undefined
  };
}
/* One sanitation path for EVERY array of plan records entering memory —
   import, localStorage load, and cross-tab sync. Drops non-object entries
   (instead of normalizing garbage into "Untitled Plan" stubs) and re-keys
   duplicate ids, which would otherwise alias two plans onto one record via
   planById's first-match. */
function sanitizePlans(raw){
  const arr = Array.isArray(raw) ? raw : [];
  const plans = arr.filter(p => p && typeof p==='object' && !Array.isArray(p)).map(normalizePlan);
  const seen = new Set();
  for (const p of plans){ if (seen.has(p.id)) p.id = uid(); seen.add(p.id); }
  return plans;
}

/* ================================================================
   ENGINE — gating, due dates, progress, warnings, lifecycle
   ================================================================ */
function taskLabel(def, plan){ return def.labelFn ? def.labelFn(plan) : def.label; }

function applicableTasks(plan){
  return TASKS.filter(t => !t.gate || t.gate(plan));
}
function applicableByPhase(plan){
  const map = {};
  for (const t of applicableTasks(plan)) (map[t.phase] = map[t.phase]||[]).push(t);
  return map;
}
function taskState(plan, id){
  return plan.tasks[id] || {status:'open', note:''};
}
function anchorDate(plan, anchor){
  const i = plan.intake;
  switch(anchor){
    case 'day1': {
      if (i.day1) return parseISO(i.day1);
      const c = new Date(plan.createdAt);
      return isNaN(c) ? null : new Date(c.getFullYear(), c.getMonth(), c.getDate());
    }
    case 'effective_date': return parseISO(i.effectiveDate);
    case 'wire_date': return parseISO(i.wireDate);
    case 'first_payroll_ta_date': return parseISO(i.firstPayrollTaDate);
    case 'final_files': {
      const w = parseISO(i.wireDate);
      if (w) return addDays(w, 7);
      const e = parseISO(i.effectiveDate);
      return e ? addDays(e, -14) : null;   // startup fallback: pre-EFF load window
    }
    default: return null;
  }
}
function dueDate(plan, def){
  const st = taskState(plan, def.id);
  if (st.dueOverride){ const d = parseISO(st.dueOverride); if (d) return d; }
  if (def.anchor === 'manual') return null;
  const a = anchorDate(plan, def.anchor);
  return a ? addDays(a, def.offset||0) : null;
}
function isTaskOverdue(plan, def){
  const st = taskState(plan, def.id);
  if (st.status==='done' || st.status==='na') return false;
  const d = dueDate(plan, def);
  return !!d && daysFromToday(d) < 0;
}
function planProgress(plan, phaseId){
  let done=0, total=0;
  for (const def of applicableTasks(plan)){
    if (phaseId && def.phase!==phaseId) continue;
    const st = taskState(plan, def.id).status;
    if (st==='na') continue;
    total++;
    if (st==='done') done++;
  }
  return {done, total, pct: total ? Math.round(done/total*100) : 0};
}
function currentPhase(plan){
  const byPhase = applicableByPhase(plan);
  for (const ph of PHASES){
    const defs = byPhase[ph.id];
    if (!defs || !defs.length) continue;
    const open = defs.some(d => !['done','na'].includes(taskState(plan, d.id).status));
    if (open) return ph;
  }
  return null; // everything done
}
/* Pre-start plans (documents not yet received) only surface their own
   pre_start-phase tasks as overdue — day1-anchored downstream tasks would
   otherwise flood the Overdue lane the moment a fresh case is assigned. */
function urgencyEligible(plan, def){
  return plan.status!=='pre_start' || def.phase==='pre_start';
}
function overdueTasks(plan){
  return applicableTasks(plan).filter(d => isTaskOverdue(plan, d) && urgencyEligible(plan, d));
}
function isDone(plan, id){ return taskState(plan, id).status==='done'; }

function payrollWatch(plan){
  if (plan.status!=='active' && plan.status!=='pre_start') return null;
  const fp = parseISO(plan.intake.firstPayrollTaDate);
  if (!fp) return null;
  if (isDone(plan,'payroll-finalize')) return null;
  const d = daysFromToday(fp);
  if (d > 14) return null;
  return { days:d, level: d<0 ? 'overdue' : (d<=7 ? 'urgent' : 'watch') };
}
function tikWarning(plan){
  if (plan.status!=='active' && plan.status!=='pre_start') return null;
  if (!(plan.intake.strategies||[]).includes('tik')) return null;
  const w = parseISO(plan.intake.wireDate);
  if (!w) return null;
  const d = daysFromToday(w);
  if (d > 7) return null;
  if (isDone(plan,'prk-tik-account-details')) return null;
  return { days:d };
}
function planWarnings(plan){
  const out = [];
  // Complete / On-Hold plans are settled: no actionable warnings. Matches the
  // neutral countdown-pill treatment their cards get — badges here would
  // contradict the deck's active-only overdue KPI.
  if (plan.status==='complete' || plan.status==='on_hold') return out;
  const pw = payrollWatch(plan);
  if (pw) out.push({kind:'payroll', level: pw.level==='watch'?'warn':'danger',
    label:'Payroll Watch '+(pw.days<0?'· overdue':'· '+pw.days+'d'),
    detail:'First payroll in TA '+fmtISO(plan.intake.firstPayrollTaDate)+' and payroll is not finalized.'});
  const tw = tikWarning(plan);
  if (tw) out.push({kind:'tik', level:'danger', label:'TIK '+(tw.days<0?'· wire passed':'· wire in '+tw.days+'d'),
    detail:'TIK strategy with wire inside 7 days and TIK account details not confirmed.'});
  const od = overdueTasks(plan).length;
  if (od) out.push({kind:'overdue', level:'danger', label: od+' overdue', detail: od+' task'+(od>1?'s':'')+' past due.'});
  const pc = plan.intake.contacts.payroll;
  if (!pc.vendorName || !pc.name) out.push({kind:'contact', level:'warn', label:'No payroll contact',
    detail:'Payroll vendor and contact should be captured for every plan.'});
  if (plan.intake.planType!=='startup'){
    const rk = plan.intake.contacts.priorRecordKeeper;
    if (!rk.vendorName || !rk.name) out.push({kind:'contact', level:'warn', label:'No prior RK contact',
      detail:'Conversions and mergers need a named prior record keeper contact.'});
  }
  if (!isDone(plan,'setup-all-docs')){
    const started = ['setup-base-template','setup-payroll-template','payroll-complete-template']
      .some(id => { const s = taskState(plan,id).status; return s!=='open' && s!=='na'; });
    if (started) out.push({kind:'dependency', level:'warn', label:'Docs not received',
      detail:'Template work has started but "Receive & review all plan documents" is not done.'});
  }
  return out;
}
function touchPlan(plan){ plan.updatedAt = new Date().toISOString(); }

function runLifecycle(plan, ctx){
  if (plan.status==='pre_start' && isDone(plan,'setup-all-docs')){
    plan.status = 'active';
    touchPlan(plan);
    toast(plan.intake.planName+' promoted to Active', 'ok');
  }
  if (plan.status!=='complete' && isDone(plan,'close-go-live-meeting') && isDone(plan,'payroll-finalize')){
    const prevStatus = ctx ? ctx.prevPlanStatus : plan.status;
    const prevArchivedAt = plan.archivedAt;
    // Completing a plan pulls ALL its tasks off the deck — if any are still
    // open, say so loudly in the toast so nothing slips off the radar silently.
    const openLeft = applicableTasks(plan).filter(d=>{
      const s = taskState(plan, d.id).status;
      return s!=='done' && s!=='na';
    }).length;
    plan.status = 'complete';
    plan.archivedAt = new Date().toISOString();
    touchPlan(plan);
    // Auto-archive is one shift-click away from an accident — give the toast
    // an Undo that reverts both the plan status and the triggering task.
    const undo = (ctx && ctx.taskId) ? {label:'Undo', fn:()=>{
      if (!db.plans.includes(plan)){ toast('That plan is no longer in the portfolio', 'warn'); return; }
      const t = plan.tasks[ctx.taskId];
      if (t){ t.status = ctx.prevTaskStatus || 'open'; delete t.completedAt; t.updatedAt = new Date().toISOString(); }
      plan.status = (prevStatus==='complete') ? 'active' : prevStatus;
      if (prevArchivedAt) plan.archivedAt = prevArchivedAt; else delete plan.archivedAt;
      touchPlan(plan); saveDb(); render();
      toast('Completion undone — '+plan.intake.planName+' is '+PLAN_STATUS[plan.status].label+' again', 'warn');
    }} : null;
    if (openLeft)
      toast(plan.intake.planName+' marked Complete — '+openLeft+' open task'+(openLeft>1?'s':'')+' archived with it', 'warn',
        undo ? {action:undo, life:9000} : {life:9000});
    else
      toast(plan.intake.planName+' marked Complete 🎉', 'ok', undo ? {action:undo, life:6500} : undefined);
  }
  // If a completion-trigger task leaves Done while the plan sits at Complete,
  // reopen the plan — otherwise its open tasks vanish from every lane and KPI.
  if (plan.status==='complete' && ctx && ctx.taskId
      && ['close-go-live-meeting','payroll-finalize'].includes(ctx.taskId)
      && !isDone(plan, ctx.taskId)){
    plan.status = 'active';
    delete plan.archivedAt;
    touchPlan(plan);
    toast(plan.intake.planName+' reopened — a completion task is no longer done', 'warn');
  }
}

function mkSeed(o){
  const plan = normalizePlan({
    id: o.id, createdAt: o.createdAt, updatedAt: o.createdAt,
    status: o.status, intake: o.intake, characteristics: o.chars||{},
    notes: o.notes||'', dateHistory: o.dateHistory||[], demo: !!o.demo
  });
  if (o.archivedAt) plan.archivedAt = o.archivedAt;
  // Mark whole phases done...
  const donePh = new Set(o.donePhases||[]);
  for (const def of applicableTasks(plan)){
    if (donePh.has(def.phase)){
      const due = dueDate(plan, def);
      plan.tasks[def.id] = {status:'done', note:'',
        completedAt: due ? toISO(due)+'T16:00:00' : plan.createdAt, updatedAt: plan.createdAt};
    }
  }
  // ...then apply explicit per-task overrides
  for (const [id, spec] of Object.entries(o.taskStates||{})){
    const cur = plan.tasks[id] || {status:'open', note:'', updatedAt: plan.createdAt};
    cur.status = spec[0];
    if (spec[1]) cur.note = spec[1];
    if (spec[2]) cur.dueOverride = spec[2];
    if (spec[0]==='done' && !cur.completedAt){
      const def = TASK_BY_ID[id];
      const due = def ? dueDate(plan, def) : null;
      cur.completedAt = due ? toISO(due)+'T15:00:00' : plan.updatedAt;
    }
    if (spec[0]!=='done') delete cur.completedAt;
    plan.tasks[id] = cur;
  }
  return plan;
}

<script>
'use strict';
/* ================================================================
   UI STATE + SHARED RENDER HELPERS
   ================================================================ */
const ui = {
  view: 'deck',
  deckFilter: 'active',            // all | active | on_hold | complete
  calYear: today().getFullYear(),
  calMonth: today().getMonth(),
  calSelected: toISO(today()),
  phaseCollapsed: {},              // `${planId}:${phaseId}` -> bool
  editIntake: false,
  flashTask: null,
  refQuery: ''
};

function viewRoot(){ return $('#viewRoot'); }

function countdownPill(kind, iso, neutral){
  const d = parseISO(iso);
  if (!d) return '<span class="pill pill-plain">'+kind+' —</span>';
  // Finished / paused plans get a calm dated pill instead of urgency colors.
  if (neutral) return '<span class="pill pill-plain" title="'+kind+' '+esc(fmtISO(iso))+'">'+kind+' '+esc(fmtShort(d))+'</span>';
  const n = daysFromToday(d);
  let cls;
  // A milestone already behind us is history, not an alarm — red is reserved
  // for approaching dates and genuinely overdue work.
  if (n<0) cls = 'pill-plain';
  else if (kind==='EFF') cls = n>30 ? 'pill-ok' : (n>=14 ? 'pill-warn' : 'pill-danger');
  else if (kind==='WIRE') cls = n>14 ? 'pill-ok' : (n>=7 ? 'pill-warn' : 'pill-danger');
  else cls = n>14 ? 'pill-ok' : (n>=7 ? 'pill-warn' : 'pill-danger');
  const txt = n===0 ? 'today' : (n>0 ? n+'d' : Math.abs(n)+'d ago');
  return '<span class="pill '+cls+'" title="'+kind+' '+esc(fmtISO(iso))+'">'+kind+' '+txt+'</span>';
}
function typeBadge(plan){
  const t = plan.intake.planType;
  const lbl = t==='startup' ? 'Startup' : t==='merger'
    ? ('Merger'+(plan.intake.mergerType ? ' · '+plan.intake.mergerType : '')) : 'Conversion';
  return '<span class="type-badge type-'+t+'">'+esc(lbl)+'</span>';
}
function strategyChips(plan){
  return (plan.intake.strategies||[]).map(s=>'<span class="chip">'+esc(s)+'</span>').join('');
}
function warningPills(plan, max){
  const ws = planWarnings(plan);
  const shown = max ? ws.slice(0, max) : ws;
  let html = shown.map(w =>
    '<span class="pill pill-'+(w.level==='danger'?'danger':'warn')+'" title="'+escAttr(w.detail)+'">'+esc(w.label)+'</span>'
  ).join('');
  if (max && ws.length>max) html += '<span class="pill pill-plain">+'+(ws.length-max)+'</span>';
  return html;
}
function progressBar(pct, color){
  return '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%;'+(color?('background:'+color):'')+'"></div></div>';

/* ================================================================
   VIEW: COMMAND DECK
   ================================================================ */
function collectLaneItems(){
  const t0 = today();
  const overdue=[], dueToday=[], thisWeek=[], waiting=[];
  for (const plan of activePlans()){
    for (const def of applicableTasks(plan)){
      const st = taskState(plan, def.id);
      if (st.status==='done' || st.status==='na') continue;
      const due = dueDate(plan, def);
      if (st.status==='waiting') waiting.push({plan, def, due});
      if (!due || !urgencyEligible(plan, def)) continue;
      const n = daysBetween(t0, due);
      if (n<0) overdue.push({plan, def, due, n});
      else if (n===0) dueToday.push({plan, def, due, n});
      else if (n<=7) thisWeek.push({plan, def, due, n});
    }
  }
  const byDue = (a,b)=>(a.due?a.due.getTime():9e15)-(b.due?b.due.getTime():9e15);
  overdue.sort(byDue); dueToday.sort(byDue); thisWeek.sort(byDue); waiting.sort(byDue);
  return {overdue, dueToday, thisWeek, waiting};
}
function laneItemHTML(item, opts={}){
  const {plan, def, due} = item;
  const n = due ? daysFromToday(due) : null;
  const ph = PHASE_BY_ID[def.phase];
  const st = taskState(plan, def.id).status;
  // Items already shown in an urgency lane (Overdue / Due Today / This Week)
  // render as compact one-line references here so the Waiting lane doesn't
  // restate half the deck. opts.dupLanes: Map of "planId:taskId" -> lane name.
  const dupLane = opts.dupLanes ? opts.dupLanes.get(plan.id+':'+def.id) : null;
  if (dupLane){
    const hotRef = dupLane==='Overdue' || dupLane==='Due Today';
    return '<div class="li-wrap">'
      +'<button class="lane-item li-compact" data-action="open-task" data-plan="'+escAttr(plan.id)+'" data-task="'+def.id+'"'
      +' title="'+escAttr(taskLabel(def, plan))+'">'
      +'<span class="li-plan">'+esc(plan.intake.planName)+'</span>'
      +'<span class="li-label">'+esc(taskLabel(def, plan))+'</span>'
      +'<span class="li-meta"><span class="'+(hotRef?'neg':'')+'">also in '+esc(dupLane)+'</span></span>'
      +'</button></div>';
  }
  // Mark items already in a partner's hands so Overdue/Due lanes distinguish
  // "on my desk" from "waiting on someone else".
  const statusPill = (!opts.noStatusPill && st==='waiting') ? '<span class="pill pill-wait">waiting</span>'
    : (!opts.noStatusPill && st==='working') ? '<span class="pill pill-accent">working</span>' : '';
  const waitCls = (!opts.noStatusPill && st==='waiting') ? ' is-waiting' : '';
  return '<div class="li-wrap">'
    +'<button class="lane-item'+waitCls+'" data-action="open-task" data-plan="'+escAttr(plan.id)+'" data-task="'+def.id+'">'
    +'<span class="li-plan">'+esc(plan.intake.planName)+'</span>'
    +'<span class="li-label">'+esc(taskLabel(def, plan))+'</span>'
    +'<span class="li-meta">'
      +'<span style="color:'+ph.color+'">'+esc(ph.label)+'</span>'
      +(due ? '<span class="'+(n<0?'neg':'')+'">'+esc(fmtShort(due))+' · '+esc(relDays(n))+'</span>' : '<span>no date</span>')
      +(def.sla?'<span>'+esc(def.sla)+'</span>':'')
      +statusPill
    +'</span></button>'
    +'<button class="li-done" data-action="quick-done" data-plan="'+escAttr(plan.id)+'" data-task="'+def.id+'"'
      +' aria-label="Mark '+escAttr(taskLabel(def, plan))+' done" title="Mark done without leaving the deck">✓</button>'
    +'</div>';
}
function laneHTML(title, items, opts={}){
  const hot = opts.hot && items.length>0;
  let body;
  if (!items.length) body = '<div class="lane-empty">'+esc(opts.empty||'Nothing here')+'</div>';
  else if (opts.groupByDay){
    // Day sub-headers (items arrive due-sorted) so a full week reads as a
    // schedule instead of an undifferentiated scroll.
    body = ''; let curKey = null;
    for (const it of items){
      const key = it.due ? toISO(it.due) : 'none';
      if (key !== curKey){
        curKey = key;
        body += '<div class="lane-day">'+(it.due ? esc(DOW_S[it.due.getDay()]+' '+fmtShort(it.due)) : 'No date')+'</div>';
      }
      body += laneItemHTML(it, opts);
    }
  } else body = items.map(it=>laneItemHTML(it, opts)).join('');
  return '<div class="lane'+(hot?' hot':'')+'"'+(opts.id?' id="'+opts.id+'"':'')+'>'
    +'<div class="lane-head"><span class="dot" style="background:'+(opts.color||'var(--faint)')+'"></span>'
    +'<span class="eyebrow">'+esc(title)+'</span>'
    +(opts.note?'<span class="lane-note">'+esc(opts.note)+'</span>':'')
    +'<span class="lane-count">'+items.length+'</span></div>'
    +'<div class="lane-body">'+body+'</div></div>';
}

function renderDeck(){
  const act = activePlans();
  if (!db.plans.length){
    viewRoot().innerHTML =
      '<div class="empty-state">'
      +'<div class="brand-mark" style="width:44px;height:44px;font-size:15px" aria-hidden="true">DC</div>'
      +'<h3>No plans on deck</h3>'
      +'<p>Add your first plan as it’s assigned, or load the demo portfolio to see the Command Center fully lit up.</p>'
      +'<div class="empty-actions">'
      +'<button class="btn btn-primary" data-action="open-new-plan">Add a plan</button>'
      +'<button class="btn" data-action="reset-demo">Load demo data</button>'
      +'</div></div>';
    return;
  }
  const lanes = collectLaneItems();
  const watchCount = act.filter(p=>payrollWatch(p)).length;
  let nextWire = null;
  for (const p of act){
    const w = parseISO(p.intake.wireDate);
    if (w && daysFromToday(w)>=0 && (!nextWire || w<nextWire.d)) nextWire = {d:w, plan:p};
  }
  // Overdue splits into "on Joel's desk" vs "already in a partner's hands" so
  // the headline number doesn't overstate what he personally must act on.
  const odWait = lanes.overdue.filter(x=>taskState(x.plan, x.def.id).status==='waiting').length;
  const odMine = lanes.overdue.length - odWait;
  const kpis =
    '<div class="kpi-row">'
    +kpi('Active Plans', act.length, act.filter(p=>p.status==='pre_start').length+' pre-start', 'k-accent', {target:'portfolioGrid'})
    +kpi('Tasks Due Today', lanes.dueToday.length, lanes.dueToday.length?'act on these first':'clear', lanes.dueToday.length?'k-warn':'k-ok', {target:'lane-due-today'})
    +kpi('Overdue', lanes.overdue.length,
        lanes.overdue.length ? (odWait ? odMine+' yours · '+odWait+' waiting' : 'past due, not done') : 'nothing slipped',
        lanes.overdue.length?'k-danger':'k-ok', {target:'lane-overdue'})
    +kpi('Waiting on Partners', lanes.waiting.length, 'external hands', 'k-wait', {target:'lane-waiting'})
    +kpi('Payroll Watch', watchCount, 'first payroll ≤14d', watchCount?'k-violet':'k-ok', {target:'lane-payroll'})
    +kpi('Next Wire', nextWire?daysFromToday(nextWire.d)+'d':'—',
        nextWire?nextWire.plan.intake.planName+' · '+fmtShort(nextWire.d):'no wires scheduled',
        !nextWire ? '' : (daysFromToday(nextWire.d)<7 ? 'k-danger' : (daysFromToday(nextWire.d)<=14 ? 'k-warn' : 'k-ok')),
        nextWire ? {plan:nextWire.plan.id} : null)
    +'</div>';

  const lanesHtml =
    '<div class="section-head"><span class="eyebrow">Attention</span><h2>Needs your eyes</h2></div>'
    +'<div class="lanes">'
    +laneHTML('Overdue', lanes.overdue, {color:'var(--danger)', hot:true, empty:'Nothing overdue', id:'lane-overdue',
        note: odWait ? odWait+' waiting' : ''})
    +laneHTML('Due Today', lanes.dueToday, {color:'var(--warn)', empty:'Nothing due today', id:'lane-due-today'})
    +laneHTML('This Week', lanes.thisWeek, {color:'var(--accent)', empty:'Quiet week ahead', id:'lane-week', groupByDay:true})
    +payrollWatchLaneHTML()
    +laneHTML('Waiting on Partners', lanes.waiting, {color:'var(--wait)', empty:'No open waits', noStatusPill:true, id:'lane-waiting',
        // Later assignments win: an item in several urgency lanes is credited
        // to the hottest one (Overdue > Due Today > This Week).
        dupLanes: (()=>{ const m = new Map();
          for (const x of lanes.thisWeek) m.set(x.plan.id+':'+x.def.id, 'This Week');
          for (const x of lanes.dueToday) m.set(x.plan.id+':'+x.def.id, 'Due Today');
          for (const x of lanes.overdue) m.set(x.plan.id+':'+x.def.id, 'Overdue');
          return m; })()})
    +'</div>';

  let shown;
  if (ui.deckFilter==='active') shown = act;                       // active + pre-start
  else if (ui.deckFilter==='on_hold') shown = db.plans.filter(p=>p.status==='on_hold');
  else if (ui.deckFilter==='complete') shown = db.plans.filter(p=>p.status==='complete');
  else shown = db.plans.slice();
  // Attention-weighted order: plans with overdue work float first, then the
  // nearest upcoming WIRE/EFF milestone, with EFF date as the tiebreaker —
  // the always-open glance screen should lead with what needs eyes, not with
  // whichever nearly-done plan happens to have the oldest effective date.
  const live = p => p.status==='active' || p.status==='pre_start';
  const nextMilestone = p => {
    let best = Infinity;
    for (const iso of [p.intake.wireDate, p.intake.effectiveDate]){
      const d = parseISO(iso);
      if (!d) continue;
      const n = daysFromToday(d);
      if (n>=0 && n<best) best = n;
    }
    return best;
  };
  shown = shown.slice().sort((a,b)=>{
    const oa = live(a) ? overdueTasks(a).length : 0;
    const ob = live(b) ? overdueTasks(b).length : 0;
    if (oa!==ob) return ob-oa;
    const na = live(a) ? nextMilestone(a) : Infinity;
    const nb = live(b) ? nextMilestone(b) : Infinity;
    if (na!==nb) return na-nb;
    return (a.intake.effectiveDate||'9999').localeCompare(b.intake.effectiveDate||'9999');
  });

  const portfolio =
    '<div class="section-head" style="display:flex;align-items:center">'
    +'<span class="eyebrow">Portfolio</span><h2>Plans</h2>'
    +'<div class="filter-row" style="margin-left:auto">'
    +[['all','All'],['active','Active'],['on_hold','On Hold'],['complete','Complete']].map(([f,lbl])=>'<button class="filter-chip'+(ui.deckFilter===f?' active':'')+'" data-action="deck-filter" data-filter="'+f+'">'+lbl+'</button>').join('')
    +'</div></div>'
    +(shown.length
      ? '<div class="plan-grid" id="portfolioGrid">'+shown.map(planCardHTML).join('')+'</div>'
      : '<div class="empty-state" id="portfolioGrid"><h3>No plans in this filter</h3><p>Switch filters or add a new plan.</p></div>');

  viewRoot().innerHTML = kpis + lanesHtml + portfolio;
  markLaneOverflow();
}
/* Scrollable lanes get a bottom fade so clipped items read as "more below". */
function markLaneOverflow(){
  for (const b of $$('.lane-body', viewRoot())){
    b.classList.toggle('has-more', b.scrollHeight - b.clientHeight > 4);
    b.classList.toggle('at-end', b.scrollTop + b.clientHeight >= b.scrollHeight - 6);
  }
}
/* KPI tiles double as jump targets: click scrolls to the matching lane
   (or portfolio / plan) so the headline number is one click from its detail. */
function kpi(label, value, sub, cls, jump){
  // Escape at the sink so any future call site passing user data is safe
  // by construction (same convention as the other render helpers).
  const inner = '<span class="eyebrow">'+esc(label)+'</span>'
    +'<span class="kpi-value">'+esc(String(value))+'</span><span class="kpi-sub">'+esc(String(sub==null?'':sub))+'</span>';
  if (jump && jump.plan)
    return '<button type="button" class="kpi '+(cls||'')+'" data-action="open-plan" data-plan="'+escAttr(jump.plan)+'">'+inner+'</button>';
  if (jump && jump.target)
    return '<button type="button" class="kpi '+(cls||'')+'" data-action="kpi-jump" data-target="'+jump.target+'">'+inner+'</button>';
  return '<div class="kpi '+(cls||'')+'">'+inner+'</div>';
}

    +'</section>';
}
function renderPlanDetail(){
  const plan = planById(db.selectedPlanId);
  if (!plan){
    // plan picker
    const rows = db.plans.slice().sort((a,b)=>(a.intake.effectiveDate||'9999').localeCompare(b.intake.effectiveDate||'9999'));
    viewRoot().innerHTML =
      '<div class="section-head"><span class="eyebrow">Plan Detail</span><h2>Pick a plan</h2></div>'
      +(rows.length

  const i = plan.intake, c = i.contacts;

  const header =

    +'</div>'
    +'<div class="card detail-head">'
      +'<div class="dh-title-row">'
        +'<h2>'+esc(i.planName)+'</h2>'
        +'<span class="pc-case mono" style="margin-top:0">'+esc(i.caseNumber||'—')+'</span>'
        +typeBadge(plan)
        +(plan.demo?'<span class="pill pill-plain" title="Demo-only case — not part of the assigned portfolio">demo</span>':'')
        +'<select class="status-select '+planStatusPillClass(plan.status)+'" data-plan-status data-plan="'+escAttr(plan.id)+'" aria-label="Plan status">'
          +Object.entries(PLAN_STATUS).map(([k,v])=>'<option value="'+k+'"'+(plan.status===k?' selected':'')+'>'+v.label+'</option>').join('')
        +'</select>'
        +'<span style="margin-left:auto;display:inline-flex;gap:8px">'
          +(i.clientFolderUrl && /^https?:\/\//i.test(i.clientFolderUrl.trim())?'<a class="btn btn-sm" href="'+escAttr(i.clientFolderUrl.trim())+'" target="_blank" rel="noopener">Client folder ↗</a>':'')
          +'<button class="btn btn-sm'+(ui.editIntake?' btn-primary':'')+'" data-action="edit-intake">'+(ui.editIntake?'Done editing':'Edit intake')+'</button>'
        +'</span>'
      +'</div>'
      +'<div class="dh-sub">'
        +strategyChips(plan)
        +(plan.characteristics.isOneOnePlan?'<span class="chip">1/1 plan</span>':'')

        +(plan.characteristics.autoEnroll?'<span class="chip">auto-enroll</span>':'')
        +(plan.characteristics.loans?'<span class="chip">loans</span>':'')
        +(plan.characteristics.roth?'<span class="chip">roth</span>':'')
        +'<span class="chip" title="Task due dates are calendar-day offsets from anchors">calendar-day offsets</span>'
      +'</div>'
      +(ui.editIntake ? intakeFormHTML(plan) :
        '<div class="date-tiles">'
          +dateTile('Effective Date', i.effectiveDate, 'EFF')
          +(i.planType!=='startup'?dateTile('Wire Date', i.wireDate, 'WIRE'):'')
          +dateTile('First Payroll in TA', i.firstPayrollTaDate, 'FP')
          +dateTile('Day 1', i.day1, null)
        +'</div>'
        +'<div class="contact-grid">'
          +contactCell('Client', c.client.name, c.client.email, !c.client.name)
          +contactCell('TM', c.tm, 'Transition Manager', !c.tm)
          +contactCell('TC', c.tc, 'Transition Consultant', !c.tc)
          +contactCell('Payroll', c.payroll.vendorName?(c.payroll.vendorName+(c.payroll.name?' · '+c.payroll.name:'')):'', c.payroll.email, !c.payroll.vendorName)
          +(i.planType!=='startup'?contactCell('Prior RK', c.priorRecordKeeper.vendorName?(c.priorRecordKeeper.vendorName+(c.priorRecordKeeper.name?' · '+c.priorRecordKeeper.name:'')):'', c.priorRecordKeeper.email, !c.priorRecordKeeper.vendorName):'')
          +contactCell('DC File Coordinator', i.dcFileCoordinator, '', !i.dcFileCoordinator)
        +'</div>')
      +(warnings.length?'<div class="warn-strip">'+warnings.map(w=>'<span class="pill pill-'+(w.level==='danger'?'danger':'warn')+'" title="'+escAttr(w.detail)+'">'+esc(w.label)+'</span>').join('')+'</div>':'')
    +'</div>';

  const phasesHtml = PHASES
    .filter(ph => (byPhase[ph.id]||[]).length)
    .map(ph => phaseBlockHTML(plan, ph, byPhase[ph.id]))
    .join('');

  const historyHtml = plan.dateHistory.length
    ? '<div class="history-list">'+plan.dateHistory.slice().reverse().map(h=>{
        const names = {effectiveDate:'Effective Date', wireDate:'Wire Date', firstPayrollTaDate:'First Payroll in TA', day1:'Day 1'};
        return '<div class="history-item"><span class="hv">'+esc(names[h.field]||h.field)+' → '+(parseISO(h.newDate)?esc(fmtISO(h.newDate)):'cleared')+'</span>'
          +'<span class="ht">'+esc(fmtStamp(h.changedAt))+'</span></div>';
      }).join('')+'</div>'
    : '<div class="lane-empty" style="padding:8px 0;text-align:left">No date changes recorded</div>';

  const side =
    '<div class="side-panel">'
    +'<div class="card side-card"><h3><span class="dot" style="background:'+(cur?cur.color:'var(--ok)')+'"></span>Where this plan stands</h3>'
      +'<div class="pc-progress" style="margin-bottom:8px">'+progressBar(prog.pct, cur?cur.color:null)+'<span class="mono">'+prog.done+'/'+prog.total+'</span></div>'
      +'<div class="kpi-sub">'+(cur?('Current phase: <strong>'+esc(cur.label)+'</strong> — '+esc(cur.sub)):'All applicable tasks are done or N/A.')+'</div>'
    +'</div>'
    +'<div class="card side-card"><h3>Plan notes</h3>'
      +'<textarea class="notes-area" data-plan-notes data-plan="'+escAttr(plan.id)+'" placeholder="Running notes for this plan…" aria-label="Plan notes">'+esc(plan.notes)+'</textarea>'
    +'</div>'
    +'<div class="card side-card"><h3>Date history</h3>'+historyHtml+'</div>'
    +'</div>';

  viewRoot().innerHTML = header
    +'<div class="detail-cols"><div>'+phasesHtml+'</div>'+side+'</div>';

  if (ui.flashTask){
    const row = viewRoot().querySelector('[data-task-row="'+ui.flashTask+'"]');
    if (row){
      const block = row.closest('.phase-block');
      if (block && !block.classList.contains('open')){
        block.classList.add('open');
        const head = block.querySelector('.phase-head');
        if (head) head.setAttribute('aria-expanded','true');
      }
      row.classList.add('flash');
      setTimeout(()=>{ row.scrollIntoView({block:'center', behavior:'smooth'}); }, 60);
    }
    ui.flashTask = null;
  }
}

<script>
'use strict';
/* ================================================================
   VIEW: TIMELINE (Gantt)
   ================================================================ */
let PX_DAY = 4;   // 4 = compact, 8 = wide (zoom toggle in the Timeline head)

function planPhaseSpans(plan){
  const byPhase = applicableByPhase(plan);
  const spans = [];
  for (const ph of PHASES){
    const defs = byPhase[ph.id]; if (!defs) continue;
    let min=null, max=null;
    for (const d of defs){
      const due = dueDate(plan, d);
      if (!due) continue;
      if (!min || due<min) min = due;
      if (!max || due>max) max = due;
    }
    if (!min) continue;
    if (daysBetween(min,max)<2){ min = addDays(min,-1); max = addDays(max,1); }
    spans.push({ph, start:min, end:max});
  }
  return spans;
}
function renderTimeline(){
  const plans = activePlans().slice()
    .sort((a,b)=>(a.intake.effectiveDate||'9999').localeCompare(b.intake.effectiveDate||'9999'));
  if (!plans.length){
    viewRoot().innerHTML = '<div class="empty-state"><h3>Nothing to plot</h3>'
      +'<p>The timeline draws one row per active plan. Add a plan or load the demo data.</p>'
      +'<div class="empty-actions"><button class="btn btn-primary" data-action="open-new-plan">Add a plan</button></div></div>';
    return;
  }
  // global range
  let min = addDays(today(), -30), max = addDays(today(), 60);
  for (const p of plans){
    for (const iso of [p.intake.day1, p.intake.effectiveDate, p.intake.wireDate, p.intake.firstPayrollTaDate]){
      const d = parseISO(iso); if (!d) continue;
      if (d < min) min = d;
      if (d > max) max = d;
    }
    for (const s of planPhaseSpans(p)){
      if (s.start<min) min = s.start;
      if (s.end>max) max = s.end;
    }
  }
  min = new Date(min.getFullYear(), min.getMonth(), 1);
  max = new Date(max.getFullYear(), max.getMonth()+1, 0);
  max = addDays(max, 14);
  // Snap the padded end back out to a whole month so the header never ends in
  // a clipped partial column (a ragged "NOV" stub against a ruler-clean strip).
  max = new Date(max.getFullYear(), max.getMonth()+1, 0);
  const totalDays = daysBetween(min, max)+1;
  const width = totalDays*PX_DAY;
  const x = d => daysBetween(min, d)*PX_DAY;

  // month header + gridlines
  let months='', gridlines='';
  let mcur = new Date(min.getFullYear(), min.getMonth(), 1);
  while (mcur <= max){
    const mEnd = new Date(mcur.getFullYear(), mcur.getMonth()+1, 0);
    const clampEnd = mEnd>max?max:mEnd;
    const w = (daysBetween(mcur<min?min:mcur, clampEnd)+1)*PX_DAY;
    months += '<div class="tl-month" style="width:'+w+'px">'+MONTHS_S[mcur.getMonth()]+' '+String(mcur.getFullYear()).slice(2)+'</div>';
    if (mcur>min) gridlines += '<div class="tl-gridline" style="left:'+x(mcur)+'px"></div>';
    mcur = new Date(mcur.getFullYear(), mcur.getMonth()+1, 1);
  }
  const todayX = x(today());
  const showToday = today()>=min && today()<=max;

  const rows = plans.map(p=>{
    const spans = planPhaseSpans(p);
    // Assign sub-lanes by interval collision (first free sub-lane whose last
    // segment ends before this one starts) so overlapping phases never
    // overpaint — index-modulo let phases three apart share a sub-lane.
    const ordered = spans.slice().sort((a,b)=>a.start-b.start || a.end-b.end);
    const laneEnds = [];
    const subLane = new Map();
    for (const s of ordered){
      let li = laneEnds.findIndex(end => end < s.start);
      if (li===-1){ li = laneEnds.length; laneEnds.push(s.end); }
      else laneEnds[li] = s.end;
      subLane.set(s, li);
    }
    const segs = spans.map(s=>{
      const left = x(s.start);
      const w = Math.max((daysBetween(s.start, s.end)+1)*PX_DAY, 6);
      const laneTop = 10 + (subLane.get(s)||0)*14;
      const info = s.ph.label+' · '+fmtShort(s.start)+' – '+fmtShort(s.end);
      // Segments are focusable and carry their tooltip as an accessible name,
      // so phase identity never depends on color + mouse-hover alone. On the
      // Wide zoom, segments wide enough also print their phase name inline.
      const inLbl = (PX_DAY>=8 && w>=64) ? '<span class="seg-lbl">'+esc(s.ph.label)+'</span>' : '';
      return '<div class="tl-seg" tabindex="0" role="img" aria-label="'+escAttr(info)+'"'
        +' style="left:'+left+'px;width:'+w+'px;top:'+laneTop+'px;background:'+s.ph.color+';color:'+s.ph.color+'"'
        +' title="'+escAttr(info)+'">'+inLbl+'</div>';
    }).join('');
    // Milestone markers: diamonds stay on one baseline; their text labels
    // render in a dedicated gutter BELOW the deepest segment sub-lane so they
    // can never overprint phase bars. Markers within ~24px of each other merge
    // into ONE combined label ("WIRE·EFF·FP") anchored at the cluster's first
    // diamond, so clustered dates never cascade into a diagonal of drifting
    // labels — and the gutter stays a single text line tall.
    const gutterTop = 10 + laneEnds.length*14;   // track-relative px, just below the deepest lane
    const mks = [
      {iso:p.intake.effectiveDate, color:'var(--ok)', lbl:'EFF'},
      {iso:p.intake.wireDate, color:'var(--warn)', lbl:'WIRE'},
      {iso:p.intake.firstPayrollTaDate, color:'var(--violet)', lbl:'FP'}
    ].map(m=>{ const d = parseISO(m.iso); return d ? {...m, d, px:x(d)} : null; })
     .filter(Boolean).sort((a,b)=>a.px-b.px);
    // Greedy chain on projected label width (~6.5px/char mono + 10px per "·"
    // separator): a marker whose label would collide with the current
    // cluster's label joins that cluster, so labels can never overlap.
    const lblW = items => items.reduce((w,m)=>w+m.lbl.length*6.5, 0) + (items.length-1)*10;
    const clusters = [];
    for (const m of mks){
      const c = clusters[clusters.length-1];
      if (c && (m.px-4) < (c.items[0].px-4) + lblW(c.items) + 6)
        c.items.push(m);
      else clusters.push({items:[m]});
    }
    const markers = mks.map(m=>
      '<div class="tl-marker" style="left:'+m.px+'px" title="'+m.lbl+' '+escAttr(fmtMed(m.d))+'">'
      +'<span class="mk" style="background:'+m.color+';top:0"></span></div>'
    ).join('')
    + clusters.map(c=>
      // Labels live in track coordinates, anchored to the cluster's first
      // marker; each keeps its own milestone color inside the combined label.
      '<span class="mk-label" style="left:'+(c.items[0].px-4)+'px;top:'+gutterTop+'px"'
      +' title="'+escAttr(c.items.map(m=>m.lbl+' '+fmtMed(m.d)).join(' · '))+'">'
      +c.items.map(m=>'<span style="color:'+m.color+'">'+m.lbl+'</span>').join('<span class="mk-sep">·</span>')
      +'</span>'
    ).join('');
    // The row grows to hold the segment sub-lanes PLUS the one-line label gutter.
    const rowH = Math.max(64, gutterTop + (mks.length ? 12 : 0) + 12);
    return '<div class="tl-row" style="min-height:'+rowH+'px">'
      +'<button class="tl-label" data-action="open-plan" data-plan="'+escAttr(p.id)+'" aria-label="Open '+escAttr(p.intake.planName)+'" style="text-align:left;cursor:pointer">'
        +'<span class="tn">'+esc(p.intake.planName)+'</span>'
        +'<span class="tc">'+esc(p.intake.caseNumber||'')+'</span>'
      +'</button>'
      +'<div class="tl-track" style="width:'+width+'px;min-width:'+width+'px">'
        +gridlines
        +(showToday?'<div class="tl-today" style="left:'+todayX+'px"></div>':'')
        +segs+markers
      +'</div></div>';
  }).join('');

  const legend =
    '<div class="tl-legend">'
    +PHASES.filter(p=>p.id!=='pre_start').map(p=>'<span class="lg"><span class="sw" style="background:'+p.color+'"></span>'+p.label+'</span>').join('')
    +'<span class="lg"><span class="dm" style="background:var(--ok)"></span>EFF</span>'
    +'<span class="lg"><span class="dm" style="background:var(--warn)"></span>Wire</span>'
    +'<span class="lg"><span class="dm" style="background:var(--violet)"></span>First Payroll TA</span>'
    +'<span class="lg"><span class="sw" style="background:var(--danger);height:2px"></span>Today</span>'
    +'</div>';

  viewRoot().innerHTML =
    '<div class="section-head" style="display:flex;align-items:center"><span class="eyebrow">Timeline</span><h2>Every plan, every phase, on one axis</h2>'
    +'<span style="margin-left:auto;display:inline-flex;gap:5px">'
      +'<button class="mini-btn'+(PX_DAY===4?' on':'')+'" data-action="tl-zoom" data-px="4" aria-pressed="'+(PX_DAY===4)+'">Compact</button>'
      +'<button class="mini-btn'+(PX_DAY===8?' on':'')+'" data-action="tl-zoom" data-px="8" aria-pressed="'+(PX_DAY===8)+'">Wide</button>'
    +'</span></div>'
    +'<div class="tl-wrap"><div class="tl-scroll" id="tlScroll"><div class="tl-canvas" style="width:'+(width+190)+'px">'
    +'<div class="tl-months"><div style="flex:0 0 190px;width:190px;position:sticky;left:0;z-index:6;background:var(--surface2);border-right:1px solid var(--border)"></div>'+months
      +(showToday?'<span class="tl-today-flag" style="left:'+(190+todayX+4)+'px;top:auto;bottom:3px">TODAY</span>':'')
    +'</div>'
    +rows
    +'</div></div>'+legend+'</div>';

  // default scroll: put the today line about one-third in from the left of the
  // visible track (biasing the frame toward upcoming work, not history),
  // snapped to the nearest month-column boundary so the leftmost month label
  // never renders clipped.
  const sc = $('#tlScroll');
  if (sc && showToday){
    // Clamp to what is actually scrollable first — otherwise the browser clamps
    // for us and the leftmost month still renders as a clipped fragment.
    const maxScroll = Math.max(0, sc.scrollWidth - sc.clientWidth);
    const trackView = Math.max(0, sc.clientWidth - 190);   // visible width beyond the sticky labels
    const desired = Math.min(Math.max(0, todayX - Math.round(trackView/3)), maxScroll);
    let snap = 0, best = Infinity;
    let mSnap = new Date(min.getFullYear(), min.getMonth(), 1);
    while (mSnap <= max){
      const mx = x(mSnap);
      if (mx <= maxScroll && Math.abs(mx - desired) < best){ best = Math.abs(mx - desired); snap = mx; }
      mSnap = new Date(mSnap.getFullYear(), mSnap.getMonth()+1, 1);
    }
    sc.scrollLeft = snap;
  }
}

/* ================================================================
   VIEW: CALENDAR
   ================================================================ */
function calendarEvents(){
  const map = {};
  const push = (iso, ev) => { if (!iso) return; (map[iso] = map[iso]||[]).push(ev); };
  for (const p of activePlans()){
    push(p.intake.effectiveDate, {kind:'eff', plan:p, label:'EFF — '+p.intake.planName, color:'var(--ok)'});
    push(p.intake.wireDate, {kind:'wire', plan:p, label:'Wire — '+p.intake.planName, color:'var(--warn)'});
    push(p.intake.firstPayrollTaDate, {kind:'fp', plan:p, label:'First Payroll TA — '+p.intake.planName, color:'var(--violet)'});
    for (const def of applicableTasks(p)){
      const st = taskState(p, def.id);
      if (st.status==='done'||st.status==='na') continue;
      const due = dueDate(p, def);
      if (!due) continue;
      const iso = toISO(due);
      const overdue = daysFromToday(due)<0 && urgencyEligible(p, def);
      push(iso, {kind:'task', plan:p, def, label:taskLabel(def,p), color: overdue?'var(--danger)':'var(--faint)', overdue});
    }
  }
  return map;
}
function renderCalendar(){
  const events = calendarEvents();
  const y = ui.calYear, m = ui.calMonth;
  const first = new Date(y, m, 1);
  const startDow = first.getDay();
  const gridStart = addDays(first, -startDow);
  const todayIso = toISO(today());

  let cells = DOW_S.map(d=>'<div class="cal-dow">'+d+'</div>').join('');
  for (let idx=0; idx<42; idx++){
    const d = addDays(gridStart, idx);
    const iso = toISO(d);
    const inMonth = d.getMonth()===m;
    const evs = events[iso]||[];
    const wknd = d.getDay()===0 || d.getDay()===6;
    // Milestone dots always render ahead of task-due dots; past four dots the
    // rest collapse into a "+N" chip — eight near-identical gray dots read no
    // differently than five at a glance, but a count does.
    const ordered = evs.slice().sort((a,b)=>(a.kind==='task'?1:0)-(b.kind==='task'?1:0));
    const dots = ordered.slice(0,4).map(e=>'<span class="cal-dot" style="background:'+e.color+'" title="'+escAttr(e.label)+'"></span>').join('')
      +(ordered.length>4?'<span class="cal-more">+'+(ordered.length-4)+'</span>':'');
    // Hover scent: name the first few items so a cluster of dots isn't opaque.
    const tip = evs.length
      ? evs.slice(0,3).map(e=>e.label).join('\n')+(evs.length>3?'\n+'+(evs.length-3)+' more':'')
      : '';
    cells += '<button class="cal-day'+(inMonth?'':' other')+(wknd?' wknd':'')+(iso===todayIso?' today':'')+(iso===ui.calSelected?' selected':'')+'"'
      +' data-action="cal-day" data-date="'+iso+'"'+(tip?' title="'+escAttr(tip)+'"':'')+' aria-label="'+escAttr(fmtMed(d)+', '+evs.length+' items')+'">'
      +'<span class="cal-num">'+d.getDate()+'</span>'
      +'<span class="cal-dots">'+dots+'</span>'
      +'</button>';
  }
  const selEvents = events[ui.calSelected]||[];
  const selDate = parseISO(ui.calSelected);
  const detail =
    '<div class="card cal-card"><div class="cal-detail-head"><span class="eyebrow">Selected day</span>'
    +'<h3 style="font-size:14.5px;font-weight:700;margin-top:2px">'+(selDate?fmtMed(selDate):'—')+'</h3></div>'
    +'<div class="cal-detail-list">'
    +(selEvents.length ? selEvents.map(e=>{
        if (e.kind==='task'){
          return '<button class="lane-item" data-action="open-task" data-plan="'+escAttr(e.plan.id)+'" data-task="'+e.def.id+'">'
            +'<span class="li-plan">'+esc(e.plan.intake.planName)+'</span>'
            +'<span class="li-label">'+esc(e.label)+'</span>'
            +'<span class="li-meta"><span class="'+(e.overdue?'neg':'')+'">'+(e.overdue?'overdue task':'task due')+'</span></span></button>';
        }
        return '<button class="lane-item" data-action="open-plan" data-plan="'+escAttr(e.plan.id)+'">'
          +'<span class="li-plan">'+esc(e.plan.intake.planName)+'</span>'
          +'<span class="li-label">'+esc(e.label)+'</span>'
          +'<span class="li-meta"><span style="color:'+e.color+'">milestone</span></span></button>';
      }).join('')
      : '<div class="lane-empty">Nothing lands on this day</div>')
    +'</div></div>';

  viewRoot().innerHTML =
    '<div class="cal-wrap">'
    +'<div class="card cal-card">'
      +'<div class="cal-toolbar">'
        +'<h3>'+MONTHS_L[m]+' '+y+'</h3>'
        +'<span style="margin-left:auto;display:inline-flex;gap:7px">'
        +'<button class="icon-btn" data-action="cal-nav" data-dir="-1" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>'
        +'<button class="btn btn-sm" data-action="cal-today">Today</button>'
        +'<button class="icon-btn" data-action="cal-nav" data-dir="1" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>'
        +'</span>'
      +'</div>'
      +'<div class="cal-grid">'+cells+'</div>'
      +'<div class="cal-legend">'

/* ================================================================

function toast(msg, kind, opts){
  const root = $('#toastRoot');
  const el = document.createElement('div');
  el.className = 'toast'+(kind?' t-'+kind:'');
  const span = document.createElement('span');
  span.textContent = msg;
  el.appendChild(span);
  if (opts && opts.action){
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'toast-act';
    b.textContent = opts.action.label;
    b.addEventListener('click', ()=>{ el.remove(); opts.action.fn(); });
    el.appendChild(b);
  }
  root.appendChild(el);
  const life = (opts && opts.life) || 3200;
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 300); }, life);
}
let modalTrigger = null;   // element to restore focus to when the dialog closes

  const first = $('#modalRoot').querySelector('input,select,textarea,button:not([data-action="close-modal"])');

function closeModal(){

    modalTrigger.focus();

function modalOpen(){ return !!$('#modalRoot').firstChild; }
/* ---------------- styled confirm layer ----------------
   Replaces window.confirm for destructive / double-check flows so the dialog
   speaks the app's design language. Lives in its own root ABOVE #modalRoot,
   so it can layer over the settings or New Plan modal without destroying the
   form state beneath it. */
let confirmState = null;   // {onOk, restoreFocus}
function openConfirm(opts){
  confirmState = { onOk: opts.onOk, restoreFocus: document.activeElement };
  $('#confirmRoot').innerHTML =
    '<div class="modal-overlay" data-confirm-overlay>'
    +'<div class="modal modal-sm confirm-modal" role="alertdialog" aria-modal="true" aria-labelledby="cfTitle">'
    +'<div class="modal-head"><h2 id="cfTitle">'+esc(opts.title||'Are you sure?')+'</h2></div>'

    +'<button type="button" class="btn" data-confirm-cancel>Cancel</button>'

    +'</span></div></div></div>';
  setTimeout(()=>{ const b = $('#confirmRoot [data-confirm-cancel]'); if (b) b.focus(); }, 30);
}
function closeConfirm(runOk){
  const st = confirmState;
  confirmState = null;
  $('#confirmRoot').innerHTML = '';
  if (st && st.restoreFocus && document.contains(st.restoreFocus)
      && typeof st.restoreFocus.focus==='function') st.restoreFocus.focus();
  if (runOk && st && st.onOk) st.onOk();
}
function confirmOpen(){ return !!$('#confirmRoot').firstChild; }
function trapModalTab(e){
  // The confirm layer sits above any modal — trap inside it first.
  const modal = $('#confirmRoot .modal') || $('#modalRoot .modal');
  if (!modal) return;
  const foc = $$('input,select,textarea,button,a[href]', modal)
    .filter(el=>!el.disabled && el.offsetParent!==null);
  if (!foc.length){ e.preventDefault(); return; }
  const first = foc[0], last = foc[foc.length-1], cur = document.activeElement;
  if (e.shiftKey && (cur===first || !modal.contains(cur))){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && (cur===last || !modal.contains(cur))){ e.preventDefault(); first.focus(); }
}

function submitNewPlan(){
  const v = id => { const n = $('#np-'+id); return n ? n.value.trim() : ''; };
  const chk = id => { const n = $('#np-'+id); return !!(n && n.checked); };
  const type = v('planType');
  const isStartup = type==='startup';
  const strategies = isStartup ? [] :
    ['cash','mapping','tik'].filter(s=>chk('strat-'+s));
  const errors = {};
  if (!v('planName')) errors.planName = true;
  if (!CASE_RE.test(v('caseNumber').toUpperCase())) errors.caseNumber = true;
  if (!v('effectiveDate')) errors.effectiveDate = true;
  if (!v('firstPayrollTaDate')) errors.firstPayrollTaDate = true;
  if (type==='merger' && !v('mergerType')) errors.mergerType = true;
  if (!isStartup && !strategies.length) errors.strategies = true;
  $$('.field', $('#newPlanForm')).forEach(f=>{
    const key = f.getAttribute('data-np-field');
    f.classList.toggle('invalid', !!(key && errors[key]));
  });
  if (Object.keys(errors).length){
    const firstBad = $('#newPlanForm .field.invalid input, #newPlanForm .field.invalid select');
    if (firstBad) firstBad.focus();
    toast('Fix the highlighted fields', 'danger');
    return;
  }
  // Soft sanity checks — duplicate case numbers are usually a re-key mistake
  // but a re-assigned case can be legitimate, and real slips can invert
  // dates. All warnings collect into ONE styled confirm (layered above the
  // form, so nothing typed is lost) instead of blocking.
  const softWarnings = [];
  {
    const cn = v('caseNumber').toUpperCase();
    const dup = db.plans.find(p => p.intake.caseNumber === cn);
    if (dup) softWarnings.push('Case number '+cn+' already exists on “'+dup.intake.planName+'”.');
    const eff = v('effectiveDate'), wd = isStartup ? '' : v('wireDate'),
          d1 = v('day1'), fp = v('firstPayrollTaDate');
    if (wd && eff && wd > eff) softWarnings.push('Wire Date ('+wd+') is after the Effective Date ('+eff+').');
    if (d1 && eff && d1 > eff) softWarnings.push('Day 1 ('+d1+') is after the Effective Date ('+eff+').');
    if (fp && eff && fp < eff) softWarnings.push('First Payroll in TA ('+fp+') is before the Effective Date ('+eff+').');
  }
  if (softWarnings.length){
    openConfirm({
      title:'Double-check before creating', okLabel:'Create anyway',
      body:'<ul>'+softWarnings.map(w=>'<li>'+esc(w)+'</li>').join('')+'</ul>'
        +'<p>Unusual, but sometimes real.</p>',
      onOk: createNewPlanFromForm
    });
    return;
  }
  createNewPlanFromForm();
}

/* ---------------- import / export ---------------- */
/* A successful recovery (import / reset / clear) retires ALL corrupt backups
   (timestamped slots plus any legacy un-suffixed key) so the space is free if
   storage is ever corrupted again. */
function clearCorruptBackup(){
  try{
    const prefix = LS_DB+'.corrupt';
    const doomed = [];
    for (let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if (k && k.indexOf(prefix)===0) doomed.push(k);
    }
    for (const k of doomed) localStorage.removeItem(k);
  }catch(e){}
}
function exportJson(){
  const payload = { exportVersion: 1, exportedAt: new Date().toISOString(), appName: APP_NAME, plans: db.plans };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'lmdc-command-center-export-'+toISO(today())+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  toast('Exported '+db.plans.length+' plan'+(db.plans.length===1?'':'s'), 'ok');
}
function handleImportFile(file){
  const reader = new FileReader();
  reader.onerror = () => toast('Could not read that file', 'danger');
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.plans)) throw new Error('no plans array');
      const okApp = !data.appName || data.appName===APP_NAME || data.appName==='LMDC Planner';
      if (!okApp) throw new Error('unknown app');
      // Drop non-object entries rather than normalizing garbage into
      // "Untitled Plan" stubs. An EMPTY plans array is far more likely a wrong
      // file than an intentional wipe (Clear All covers the deliberate case) —
      // reject it outright too.
      const plans = sanitizePlans(data.plans);
      if (!plans.length) throw new Error('no valid plans');
      openConfirm({
        title:'Import plans', danger:true, okLabel:'Replace & import',
        body:'<p>Import <strong>'+plans.length+' plan'+(plans.length===1?'':'s')+'</strong> from “'+esc(data.appName||'export')+'”?</p>'
          +'<p>This replaces the current portfolio.</p>',
        onOk: ()=>{
          db.plans = plans;
          db.selectedPlanId = null;
          saveDb();
          clearCorruptBackup();
          closeModal();
          setView('deck');
          toast('Imported '+plans.length+' plan'+(plans.length===1?'':'s'), 'ok');
        }
      });
    }catch(err){
      toast('Import failed — not a recognized export file', 'danger');
    }
  };
  reader.readAsText(file);
}

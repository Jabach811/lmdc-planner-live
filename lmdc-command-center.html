  let od = 0;
  for (const p of activePlans()) od += overdueTasks(p).length;
  const badge = $('#railCountDeck');
  badge.hidden = od===0;
  badge.textContent = od;
  badge.classList.toggle('hot', od>0);
  $('#todayChip').textContent = DOW_S[today().getDay()]+' · '+fmtMed(today());
}
let lastRenderedIso = null;   // date the visible frame was computed for
function render(){
  lastRenderedIso = toISO(today());
  updateChrome();
  if (ui.view==='deck') renderDeck();
  else if (ui.view==='plan') renderPlanDetail();
  else if (ui.view==='timeline') renderTimeline();
  else if (ui.view==='calendar') renderCalendar();
  else if (ui.view==='reference') renderReference();
}
function setView(v){
  ui.view = v;
  if (v!=='plan') ui.editIntake = false;
  try{ localStorage.setItem(LS_VIEW, v); }catch(e){}
  render();
  viewRoot().scrollTop = 0;
}

/* ================================================================
   MUTATIONS
   ================================================================ */
function setTaskStatus(plan, id, status){
  const cur = plan.tasks[id] || {status:'open', note:''};
  const prevTaskStatus = cur.status || 'open';
  const prevPlanStatus = plan.status;
  cur.status = status;
  cur.updatedAt = new Date().toISOString();
  if (status==='done') cur.completedAt = new Date().toISOString();
  else delete cur.completedAt;
  plan.tasks[id] = cur;
  touchPlan(plan);
  runLifecycle(plan, {taskId:id, prevTaskStatus, prevPlanStatus});
  saveDb();
}
function cycleStatus(plan, id){
  const cur = taskState(plan, id).status;
  let next;
  if (cur==='na') next = 'open';
  else next = STATUS_ORDER[(STATUS_ORDER.indexOf(cur)+1) % STATUS_ORDER.length];
  setTaskStatus(plan, id, next);
}
const DATE_FIELDS = ['effectiveDate','wireDate','firstPayrollTaDate','day1'];
function setIntakeField(plan, path, value){
  const parts = path.split('.');
  let node = plan;
  for (let k=0; k<parts.length-1; k++) node = node[parts[k]];
  const leaf = parts[parts.length-1];
  // The model expresses "no merger type" as ABSENT, not '' — keep the live db
  // and any export canonical without waiting for the next normalizePlan pass.
  if (leaf==='mergerType' && value==='') value = undefined;
  const old = node[leaf];
  if (old===value) return {changed:false};
  node[leaf] = value;
  let dateLogged = false;
  const dateChanged = parts[0]==='intake' && parts.length===2 && DATE_FIELDS.includes(leaf);
  if (dateChanged && leaf!=='day1'){
    plan.dateHistory.push({field:leaf, newDate:value||'', changedAt:new Date().toISOString()});
    dateLogged = true;
  }
  // Startups have no strategies and no wire: switching type must clear the
  // hidden fields too, or stale tik/wireDate keeps gated tasks and TIK
  // warnings alive on a plan that no longer has a wire.
  if (leaf==='planType'){
    // mergerType only means something on a merger — clear it on ANY other type
    // or it lingers invisibly in storage and exports.
    if (value!=='merger') plan.intake.mergerType = undefined;
    if (value==='startup'){
      plan.intake.strategies = [];
      if (plan.intake.wireDate){
        plan.intake.wireDate = '';
        plan.dateHistory.push({field:'wireDate', newDate:'', changedAt:new Date().toISOString()});
      }
    }
  }
  touchPlan(plan);
  saveDb();
  return {changed:true, dateLogged, dateChanged, structural: ['planType','mergerType'].includes(leaf)};
}

/* ================================================================
   EVENTS
   ================================================================ */
/* Full re-renders rebuild the view's DOM; any mutation triggered from a
   control inside it must put focus back on the equivalent new element or
   keyboard users restart from the top of the page. */
function refocusControl(sel){
  const el = viewRoot().querySelector(sel);
  if (el) el.focus({preventScroll:true});
}
document.addEventListener('click', e=>{
  if (!e.target.closest) return;
  // Confirm layer first — it sits above everything else.
  if (e.target.closest('[data-confirm-ok]')){ closeConfirm(true); return; }
  if (e.target.closest('[data-confirm-cancel]')){ closeConfirm(false); return; }
  const cOverlay = e.target.closest('[data-confirm-overlay]');
  if (cOverlay && e.target===cOverlay){ closeConfirm(false); return; }
  const overlay = e.target.closest('[data-overlay]');
  if (overlay && e.target===overlay){ closeModal(); return; }
  const btn = e.target.closest ? e.target.closest('[data-action]') : null;
  if (!btn) return;
  const act = btn.dataset.action;
  const plan = btn.dataset.plan ? planById(btn.dataset.plan) : null;

  switch(act){
    case 'nav': setView(btn.dataset.view); break;
    case 'toggle-rail': {
      const app = $('#app');
      app.classList.toggle('rail-collapsed');
      try{ localStorage.setItem(LS_RAIL, app.classList.contains('rail-collapsed')?'collapsed':'open'); }catch(err){}
      break;
    }
    case 'toggle-theme': {
      const cur = document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
      applyTheme(cur);
      break;
    }
    case 'open-settings': openModal(settingsModalHTML()); break;
    case 'open-new-plan': closeModal(); openModal(newPlanModalHTML()); syncNewPlanConditionals(); break;
    case 'close-modal': closeModal(); break;
    case 'deck-filter': ui.deckFilter = btn.dataset.filter; renderDeck(); break;
    case 'open-plan':
      if (plan){ db.selectedPlanId = plan.id; saveDb(); ui.editIntake=false; setView('plan'); }
      break;
    case 'open-task':
      if (plan){ db.selectedPlanId = plan.id; saveDb(); ui.editIntake=false; ui.flashTask = btn.dataset.task; setView('plan'); }
      break;
    case 'cycle-status':
      if (plan){
        if (e.shiftKey) setTaskStatus(plan, btn.dataset.task, 'done');       // fast path
        else if (e.altKey) setTaskStatus(plan, btn.dataset.task, 'open');    // fast reset
        else cycleStatus(plan, btn.dataset.task);
        render();
        refocusControl('[data-action="cycle-status"][data-plan="'+plan.id+'"][data-task="'+btn.dataset.task+'"]');
      }
      break;
    case 'toggle-na':
      if (plan){
        const st = taskState(plan, btn.dataset.task).status;
        setTaskStatus(plan, btn.dataset.task, st==='na'?'open':'na');
        render();
        refocusControl('[data-action="toggle-na"][data-plan="'+plan.id+'"][data-task="'+btn.dataset.task+'"]');
      }
      break;
    case 'clear-override':
      if (plan){
        const t = plan.tasks[btn.dataset.task];
        if (t){ delete t.dueOverride; t.updatedAt = new Date().toISOString(); }
        touchPlan(plan); saveDb(); render();
        // The "auto" button itself disappears once cleared — land on the date input.
        refocusControl('[data-task-due][data-plan="'+plan.id+'"][data-task="'+btn.dataset.task+'"]');
      }
      break;
    case 'kpi-jump': {
      const el = document.getElementById(btn.dataset.target);
      if (el){
        el.scrollIntoView({behavior:'smooth', block:'start'});
        el.classList.add('flash-lane');
        setTimeout(()=>el.classList.remove('flash-lane'), 1400);
      }
      break;
    }
    case 'toggle-note': {
      const row = btn.closest('.task-row');
      if (row){
        row.classList.toggle('note-open');
        if (row.classList.contains('note-open')){
          const inp = row.querySelector('[data-task-note]');
          if (inp) inp.focus();
        }
      }
      break;
    }
    case 'toggle-phase': {
      const key = btn.dataset.plan+':'+btn.dataset.phase;
      const block = btn.closest('.phase-block');
      const nowOpen = !block.classList.contains('open');
      block.classList.toggle('open', nowOpen);
      btn.setAttribute('aria-expanded', String(nowOpen));
      ui.phaseCollapsed[key] = !nowOpen;
      break;
    }
    case 'cal-nav': {
      let m = ui.calMonth + (+btn.dataset.dir), y = ui.calYear;
      if (m<0){ m=11; y--; } if (m>11){ m=0; y++; }
      ui.calMonth=m; ui.calYear=y; renderCalendar(); break;
    }
    case 'cal-today':
      ui.calMonth = today().getMonth(); ui.calYear = today().getFullYear();
      ui.calSelected = toISO(today()); renderCalendar(); break;
    case 'cal-day': ui.calSelected = btn.dataset.date; renderCalendar(); break;
    case 'edit-intake': ui.editIntake = !ui.editIntake; renderPlanDetail(); updateChrome(); break;
    case 'export-json': exportJson(); break;
    case 'import-json': $('#importFile').click(); break;
    case 'reset-demo':
      openConfirm({
        title:'Reset demo data', danger:true, okLabel:'Reset',
        body:'<p>Replace <strong>everything</strong> with the seeded demo portfolio?</p><p>Your current plans will be overwritten.</p>',
        onOk: ()=>{
          db = { plans: buildSeedPlans(), selectedPlanId: null };
          try{ localStorage.setItem(LS_SEEDED,'1'); }catch(err){}
          saveDb(); clearCorruptBackup(); closeModal(); setView('deck'); toast('Demo data loaded', 'ok');
        }
      });
      break;
    case 'clear-all':
      openConfirm({
        title:'Clear all data', danger:true, okLabel:'Delete all',
        body:'<p>Delete <strong>all '+db.plans.length+' plan'+(db.plans.length===1?'':'s')+'</strong>?</p><p>This cannot be undone.</p>',
        onOk: ()=>{
          db = { plans: [], selectedPlanId: null };
          saveDb(); clearCorruptBackup(); closeModal(); setView('deck'); toast('All data cleared', 'warn');
        }
      });
      break;
    case 'quick-done':
      if (plan){
        const lane = btn.closest('.lane');
        const laneId = lane ? lane.id : null;
        const taskId = btn.dataset.task;
        // Remember which slot in the lane was acted on so focus can land on
        // the item that takes its place — not back at the top of the lane.
        let laneIdx = 0;
        if (lane){
          const wrap = btn.closest('.li-wrap');
          const item = wrap ? wrap.querySelector('.lane-item') : null;
          laneIdx = Math.max(0, Array.from(lane.querySelectorAll('.lane-item')).indexOf(item));
        }
        setTaskStatus(plan, taskId, 'done');
        render();
        // Keyboard users must not be dumped back to <body>: land on the item
        // now occupying the completed slot (its ✓ is focus-revealed, so the
        // item button is the focusable target), or the row's status dot on
        // Plan Detail.
        const items = laneId ? viewRoot().querySelectorAll('#'+laneId+' .lane-item') : [];
        if (items.length)
          items[Math.min(laneIdx, items.length-1)].focus({preventScroll:true});
        else
          refocusControl('[data-action="cycle-status"][data-plan="'+plan.id+'"][data-task="'+taskId+'"]');
      }
      break;
    case 'tl-zoom':
      PX_DAY = +btn.dataset.px || 4;
      renderTimeline();
      break;
  }
});

document.addEventListener('change', e=>{
  const t = e.target;
  if (t.id==='importFile'){
    if (t.files && t.files[0]) handleImportFile(t.files[0]);
    t.value = '';
    return;
  }
  if (t.id==='np-planType'){ syncNewPlanConditionals(); return; }

  const planId = t.dataset ? t.dataset.plan : null;
  const plan = planId ? planById(planId) : (ui.view==='plan' ? planById(db.selectedPlanId) : null);

  if (t.hasAttribute('data-plan-status') && plan){
    const v = t.value;
    plan.status = v;
    if (v==='complete' || v==='on_hold') plan.archivedAt = new Date().toISOString();
    else delete plan.archivedAt;
    touchPlan(plan); saveDb(); render();
    refocusControl('[data-plan-status][data-plan="'+plan.id+'"]');
    return;
  }
  if (t.hasAttribute('data-plan-notes') && plan){
    plan.notes = t.value; touchPlan(plan); saveDb();
    return;
  }
  if (t.hasAttribute('data-task-note') && plan){
    const id = t.dataset.task;
    const cur = plan.tasks[id] || {status:'open', note:''};
    cur.note = t.value.trim(); cur.updatedAt = new Date().toISOString();
    plan.tasks[id] = cur;
    touchPlan(plan); saveDb();
    // Patch the row in place instead of a full re-render — a rebuild here
    // would destroy whatever element focus just moved into.
    const row = viewRoot().querySelector('[data-task-row="'+id+'"]');
    if (row){
      row.classList.remove('note-open');
      let view = row.querySelector('.task-note-view');
      if (cur.note){
        if (!view){
          view = document.createElement('button');
          view.type = 'button'; view.className = 'task-note-view';
          view.dataset.action = 'toggle-note'; view.dataset.plan = plan.id; view.dataset.task = id;
          view.title = 'Click to edit this note';
          const editWrap = row.querySelector('.task-note-edit');
          if (editWrap) editWrap.parentNode.insertBefore(view, editWrap);
        }
        view.textContent = cur.note;
      } else if (view) view.remove();
    }
    return;
  }
  if (t.hasAttribute('data-task-due') && plan){
    const id = t.dataset.task;
    const cur = plan.tasks[id] || {status:'open', note:''};
    if (t.value){ cur.dueOverride = t.value; }
    else delete cur.dueOverride;
    cur.updatedAt = new Date().toISOString();
    plan.tasks[id] = cur;
    touchPlan(plan); saveDb(); render();
    refocusControl('[data-task-due][data-plan="'+plan.id+'"][data-task="'+id+'"]');
    return;
  }
  if (t.hasAttribute('data-intake-field') && plan){
    const field = t.dataset.intakeField;
    // Inline edits get the same guardrails as the New Plan modal: a plan
    // can't lose its name, and a case number must match the real format.
    if (field==='intake.planName' && !t.value.trim()){
      t.value = plan.intake.planName;
      toast('Plan name can’t be empty', 'danger');
      return;
    }
    if (field==='intake.caseNumber'){
      const cv = t.value.trim().toUpperCase();
      if (cv && !CASE_RE.test(cv)){
        t.value = plan.intake.caseNumber;
        toast('Case number format: QK/NQ/TA/TE/TG/JK/TO + 5 digits, dash, 5 digits', 'danger');
        return;
      }
      t.value = cv;
    }
    const res = setIntakeField(plan, field, t.value.trim());
    if (res.structural){ renderPlanDetail(); updateChrome(); }
    else if (res.dateChanged){
      // Anchor date moved: re-render so checklist due dates, overdue flags and
      // warnings reflect the new model immediately, then restore focus.
      renderPlanDetail(); updateChrome();
      const el = document.getElementById('if-'+field.replace(/\./g,'-'));
      if (el) el.focus({preventScroll:true});
      const i2 = plan.intake;
      if (i2.wireDate && i2.effectiveDate && i2.wireDate > i2.effectiveDate)
        toast('Heads up: Wire Date is now after the Effective Date', 'warn');
      else if (i2.day1 && i2.effectiveDate && i2.day1 > i2.effectiveDate)
        toast('Heads up: Day 1 is after the Effective Date', 'warn');
    }
    else if (res.changed && (field==='intake.planName' || field==='intake.caseNumber')){
      // Identity text shows in the detail header and topbar — patch those
      // nodes directly (a full re-render here would steal focus mid-form).
      const h2 = viewRoot().querySelector('.dh-title-row h2');
      if (h2 && field==='intake.planName') h2.textContent = plan.intake.planName;
      const cc = viewRoot().querySelector('.dh-title-row .pc-case');
      if (cc && field==='intake.caseNumber') cc.textContent = plan.intake.caseNumber || '—';
      updateChrome();
    }
    return;
  }
  if (t.hasAttribute('data-intake-strategy') && plan){
    const s = t.dataset.intakeStrategy;
    const set = new Set(plan.intake.strategies||[]);
    if (t.checked) set.add(s); else set.delete(s);
    plan.intake.strategies = ['cash','mapping','tik'].filter(x=>set.has(x));
    touchPlan(plan); saveDb();
    // Strategies gate tasks/warnings — re-render so the checklist beside the
    // form matches the stored model immediately, then restore focus.
    renderPlanDetail(); updateChrome();
    refocusControl('[data-intake-strategy="'+s+'"]');
    return;
  }
  if (t.hasAttribute('data-intake-char') && plan){
    plan.characteristics[t.dataset.intakeChar] = t.checked;
    touchPlan(plan); saveDb();
    // Characteristics gate loads (loans/roth/1-1) — same live re-render.
    renderPlanDetail(); updateChrome();
    refocusControl('[data-intake-char="'+t.dataset.intakeChar+'"]');
    return;
  }
});

/* Notes write through to the model on every keystroke (debounced persist +
   beforeunload flush) so text is never lost to a refresh before blur —
   the 'change' handlers above still run on blur for the re-render. */
let noteSaveTimer = null;
function scheduleNoteSave(){
  clearTimeout(noteSaveTimer);
  noteSaveTimer = setTimeout(()=>{ noteSaveTimer = null; saveDb(); }, 350);
}
window.addEventListener('beforeunload', ()=>{
  if (noteSaveTimer){ clearTimeout(noteSaveTimer); noteSaveTimer = null; saveDb(); }
});
document.addEventListener('input', e=>{
  const t = e.target;
  if (t.id==='refSearch'){
    ui.refQuery = t.value;
    applyRefFilter();
    return;
  }
  if (!t.dataset || !t.dataset.plan) return;
  const plan = planById(t.dataset.plan);
  if (!plan) return;
  if (t.hasAttribute('data-plan-notes')){
    plan.notes = t.value;
    touchPlan(plan);
    scheduleNoteSave();
  } else if (t.hasAttribute('data-task-note')){
    const id = t.dataset.task;
    const cur = plan.tasks[id] || {status:'open', note:''};
    // Trim here to match the blur ('change') handler, so the persisted value
    // is identical whichever path runs last (refresh mid-typing vs blur).
    cur.note = t.value.trim();
    cur.updatedAt = new Date().toISOString();
    plan.tasks[id] = cur;
    touchPlan(plan);
    scheduleNoteSave();
  }
});
// Keep the lane fade in sync while a lane scrolls (scroll doesn't bubble — capture).
document.addEventListener('scroll', e=>{
  const t = e.target;
  if (t && t.classList && t.classList.contains('lane-body')){
    t.classList.toggle('at-end', t.scrollTop + t.clientHeight >= t.scrollHeight - 6);
  }
}, true);
document.addEventListener('submit', e=>{
  if (e.target.id==='newPlanForm'){ e.preventDefault(); submitNewPlan(); }
});
document.addEventListener('keydown', e=>{
  if (e.key==='Escape'){
    if (confirmOpen()){ closeConfirm(false); return; }
    if (modalOpen()){ closeModal(); return; }
    return;
  }
  if (e.key==='Tab' && (confirmOpen() || modalOpen())) trapModalTab(e);
});

/* ================================================================
   THEME + INIT
   ================================================================ */
function applyTheme(theme, persist=true){
  document.documentElement.setAttribute('data-theme', theme);
  const btn = $('#themeBtn');
  if (btn){
    btn.querySelector('.ic-moon').style.display = theme==='dark' ? 'none' : '';
    btn.querySelector('.ic-sun').style.display  = theme==='dark' ? '' : 'none';
  }
  if (persist){ try{ localStorage.setItem(LS_THEME, theme); }catch(e){} }
}
/* ---------- freshness: an always-open console must roll over at midnight ---
   today() is only read at render time, so without this the deck would show
   yesterday's Due Today / Overdue / countdowns until the next click. */
function checkDayRollover(){
  if (!lastRenderedIso || toISO(today()) === lastRenderedIso || modalOpen() || confirmOpen()) return;
  // Never rebuild the DOM out from under an in-progress edit — intake fields
  // and notes with focus would lose unblurred text. Retry on the next tick.
  const ae = document.activeElement;
  if (ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName) && viewRoot().contains(ae)) return;
  render();
}
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) checkDayRollover(); });
window.addEventListener('focus', checkDayRollover);
setInterval(checkDayRollover, 60000);

/* ---------- cross-tab sync: another tab's save wins; adopt it instead of
   clobbering it with this tab's stale in-memory blob on the next click. */
let lastTabSyncToast = 0;
window.addEventListener('storage', e=>{
  if (e.key !== LS_DB) return;
  const fresh = loadDb();
  if (!fresh) return;
  db = fresh;
  db.plans = sanitizePlans(db.plans);
  if (db.selectedPlanId && !planById(db.selectedPlanId)) db.selectedPlanId = null;
  if (!modalOpen() && !confirmOpen()) render();
  const now = Date.now();
  if (now - lastTabSyncToast > 8000){
    lastTabSyncToast = now;
    toast('Portfolio synced from another tab', 'warn');
  }
});

(function init(){
  let theme = 'light';
  try{ theme = localStorage.getItem(LS_THEME) || 'light'; }catch(e){}
  applyTheme(theme, false);
  let rail = null;
  try{ rail = localStorage.getItem(LS_RAIL); }catch(e){}
  if (rail==='collapsed') $('#app').classList.add('rail-collapsed');
  seedIfNeeded();
  // Restore the last view so a refresh mid-checklist doesn't cost two clicks;
  // fall back to the deck when the stored view no longer resolves.
  let view = 'deck';
  try{ view = localStorage.getItem(LS_VIEW) || 'deck'; }catch(e){}
  if (!VIEW_TITLES[view]) view = 'deck';
  if (view==='plan' && !planById(db.selectedPlanId)) view = 'deck';
  setView(view);
})();
</script>
